<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Gulch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   NEON GULCH — a cyberpunk-cowboy UI sandbox.
   Throwaway vibe test: every common app pattern, one personality.
   Tokens first; everything below derives from them.
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme:dark;
  --bg:#120c1c; --bg-deep:#0b0712; --panel:#1a1226; --panel-2:#221833; --panel-3:#2a1f3d;
  --line:#3a2a4a; --line-strong:#6f5a85;
  --ink:#f3e9d8; --muted:#a894b5; --dim:#7a6a8a;
  --neon:#ff2e88; --neon-ink:#120c1c; --neon-soft:rgba(255,46,136,.16);
  --uplink:#2ee6ff; --uplink-soft:rgba(46,230,255,.14);
  --sunset:#ff9a3c; --sunset-soft:rgba(255,154,60,.16);
  --leather:#b5713e; --leather-soft:rgba(181,113,62,.22);
  --good:#63f0a6; --warn:#ffcf3f; --crit:#ff6b4a;
  --good-soft:rgba(99,240,166,.14); --warn-soft:rgba(255,207,63,.14); --crit-soft:rgba(255,107,74,.16);
  --status-ink:var(--ink);
  --glow:0 0 14px rgba(255,46,136,.55),0 0 2px rgba(255,46,136,.9);
  --glow-uplink:0 0 12px rgba(46,230,255,.45);
  --tube:0 0 8px rgba(255,46,136,.6), inset 0 0 8px rgba(255,46,136,.25);
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --r-state:2px; --r-opener:6px 6px 0 0; --r-record:8px; --r-pill:999px; --r-card:12px;
  --H:36px; --Hc:24px;
  --font-body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font-mono:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --font-display:'Rye','Rockwell','Georgia',serif;
  --neon-h:338;
  --skyline:radial-gradient(1100px 520px at 50% 118%, rgba(255,46,136,.13), transparent 60%),
            radial-gradient(700px 380px at 12% -10%, rgba(46,230,255,.08), transparent 60%);
}
:root[data-mode="noon"]{
  color-scheme:light;
  --bg:#efe3c8; --bg-deep:#e5d5b2; --panel:#f7eedb; --panel-2:#f1e5cc; --panel-3:#e9dbbd;
  --line:#cdb996; --line-strong:#8d7556;
  --ink:#2b1d12; --muted:#6b5643; --dim:#8c7863;
  --neon:#b0104f; --neon-ink:#f7eedb; --neon-soft:rgba(176,16,79,.12);
  --uplink:#086a78; --uplink-soft:rgba(8,106,120,.12);
  --sunset:#9a3b0a; --sunset-soft:rgba(154,59,10,.14);
  --leather:#7a4a22; --leather-soft:rgba(122,74,34,.18);
  --good:#14612c; --warn:#7a4d00; --crit:#a8231b;
  --good-soft:#9fe6b6; --warn-soft:#e9b93a; --crit-soft:#e2705f;
  --status-ink:#2b1d12;
  --glow:none; --glow-uplink:none; --tube:none;
  --shadow:0 10px 28px rgba(60,40,10,.18);
  --skyline:radial-gradient(900px 420px at 50% -20%, rgba(255,255,255,.55), transparent 60%);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--skyline),var(--bg);color:var(--ink);
  font:400 13px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
a{color:var(--uplink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--uplink);outline-offset:2px}
::selection{background:var(--neon);color:var(--neon-ink)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── icons (Lucide, runtime) ── */
.ic{display:inline-block;width:18px;height:18px;flex:none;vertical-align:-4px}
.ic svg{width:100%;height:100%;display:block}
.ic-sm{width:14px;height:14px;vertical-align:-2px}
.ic-lg{width:22px;height:22px}

/* ── scanline + vignette overlay ── */
.fx{pointer-events:none;position:fixed;inset:0;z-index:90}
.fx::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.38;mix-blend-mode:multiply}
.fx::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(0,0,0,.55)}
:root[data-mode="noon"] .fx::before{opacity:.10}
:root[data-mode="noon"] .fx::after{box-shadow:inset 0 0 120px rgba(90,60,20,.18)}
:root[data-fx="off"] .fx{display:none}

/* ── type ── */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--uplink);font-weight:400}
.display{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.15;letter-spacing:.01em}
.display-xl{font-size:34px}
.title{font-size:15px;font-weight:700}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.value{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.small{font-size:12px}
.tiny{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--dim)}
kbd,.kbd{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:3px;background:var(--panel-2);color:var(--muted)}

/* ── shell ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,var(--panel),var(--bg-deep));border-right:1px solid var(--line);overflow:auto;z-index:40}
.brand{display:flex;flex-direction:column;gap:4px;padding:6px 8px 10px;border-bottom:1px dashed var(--leather)}
.wordmark{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--neon);text-shadow:var(--glow);letter-spacing:.02em}
.wordmark small{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--uplink);text-shadow:none;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:var(--H);padding:0 10px;border-radius:var(--r-record);color:var(--muted);text-decoration:none;
  font-weight:500;border:1px solid transparent;position:relative}
.nav a .ic{color:var(--dim)}
.nav a:hover{color:var(--ink);background:var(--panel-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--neon-soft);border-color:color-mix(in srgb,var(--neon) 40%,transparent)}
.nav a[aria-current="page"] .ic{color:var(--neon);filter:drop-shadow(0 0 4px rgba(255,46,136,.7))}
:root[data-mode="noon"] .nav a[aria-current="page"] .ic{filter:none}
.nav a .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--uplink);background:var(--uplink-soft);padding:1px 6px;border-radius:var(--r-state)}
.nav .sect{margin:10px 10px 4px}
.side .spacer{flex:1}

/* rig charge + jukebox in the rail */
.rig{padding:10px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel)}
.rig .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:6px;background:var(--panel-3);border-radius:var(--r-state);overflow:hidden}
.bar i{display:block;height:100%;background:var(--uplink);box-shadow:var(--glow-uplink);border-radius:var(--r-state);transition:width .4s}
.bar.neon i{background:var(--neon);box-shadow:var(--glow)}
.bar.sun i{background:var(--sunset);box-shadow:none}
.bar.good i{background:var(--good);box-shadow:none}
.juke{padding:10px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.juke .disc{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--panel-3),var(--line-strong),var(--panel-3),var(--line-strong),var(--panel-3));
  border:2px solid var(--line-strong);position:relative}
.juke .disc::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--neon);box-shadow:var(--glow)}
.juke.playing .disc{animation:spin 3s linear infinite}
.juke .tr{display:flex;align-items:center;gap:10px;min-width:0}
.juke .tr b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.juke .ctl{display:flex;justify-content:center;gap:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* topbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:400}
.crumbs .ic{width:12px;height:12px;color:var(--dim)}
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:8px;height:var(--H);padding:0 12px;min-width:220px;border:1px solid var(--line-strong);
  border-radius:var(--r-record);background:var(--panel);color:var(--muted);cursor:text;text-align:left}
.searchbtn kbd{margin-left:auto}
.uplink{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.uplink .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.uplink.weak .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.uplink.down .dot{background:var(--crit);box-shadow:0 0 8px var(--crit)}
:root[data-mode="noon"] .uplink .dot{box-shadow:none}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;
  background:linear-gradient(135deg,var(--panel-3),var(--panel));border:1px solid var(--line-strong);color:var(--ink);flex:none;position:relative}
.avatar.lg{width:72px;height:72px;font-size:22px}
.avatar.sm{width:24px;height:24px;font-size:9px}
.avatar.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--panel)}
.avatar[data-hue]{background:linear-gradient(135deg,hsl(var(--h) 70% 30%),hsl(var(--h) 60% 18%));color:#fff}
:root[data-mode="noon"] .avatar[data-hue]{background:linear-gradient(135deg,hsl(var(--h) 50% 40%),hsl(var(--h) 45% 28%))}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-pill);background:var(--neon);color:var(--neon-ink);
  font-family:var(--font-mono);font-size:10px;display:grid;place-items:center;box-shadow:var(--glow)}

/* main */
.main{padding:22px 24px 88px;max-width:1280px;width:100%;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;margin-bottom:18px}
.ph .txt{flex:1 1 320px;min-width:0}
.ph p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.ml{margin-left:auto}
.mt{margin-top:14px}
.hr{border:0;border-top:1px dashed var(--line-strong);margin:12px 0}
.wire{border:0;height:6px;margin:14px 0;background:repeating-linear-gradient(90deg,var(--leather) 0 14px,transparent 14px 20px);opacity:.6;
  -webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;min-width:0;position:relative}
.panel.hud::before,.panel.hud::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--uplink);border-style:solid;opacity:.8}
.panel.hud::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:var(--r-card)}
.panel.hud::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:var(--r-card)}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-h .title{flex:1;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.tile{display:flex;flex-direction:column;gap:8px}
.tile .value{color:var(--ink)}
.tile .delta{font-family:var(--font-mono);font-size:11px;display:inline-flex;align-items:center;gap:4px}
.tile .delta.up{color:var(--good)} .tile .delta.down{color:var(--crit)}
.tile svg.spark{width:100%;height:36px;display:block;margin-top:auto}
.tile.neon{border-color:color-mix(in srgb,var(--neon) 50%,transparent);box-shadow:var(--tube)}
.tile.neon .value{color:var(--neon);text-shadow:var(--glow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--H);padding:0 16px;border-radius:var(--r-pill);
  border:1px solid var(--line-strong);background:var(--panel-2);color:var(--ink);cursor:pointer;font-family:var(--font-mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;text-decoration:none;transition:transform .08s,background .15s,box-shadow .15s}
.btn:hover{background:var(--panel-3);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-neon{background:var(--neon);border-color:var(--neon);color:var(--neon-ink);box-shadow:var(--glow);font-weight:400}
.btn-neon:hover{background:var(--neon);border-color:var(--neon);filter:brightness(1.08)}
.btn-uplink{border-color:var(--uplink);color:var(--uplink);background:transparent}
.btn-uplink:hover{background:var(--uplink-soft);border-color:var(--uplink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:var(--panel-2);border-color:transparent}
.btn-danger{border-color:var(--crit);color:var(--crit);background:transparent}
.btn-danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn-sm{height:28px;padding:0 12px;font-size:10px}
.btn-icon{width:var(--H);padding:0;border-radius:var(--r-record)}
.btn-icon.round{border-radius:50%}
.btn-icon.btn-sm{width:28px}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-block{width:100%}

/* chips (state · squared) / tags (record · rounded) / stamps (plain) */
.chip{display:inline-flex;align-items:center;gap:6px;height:var(--Hc);padding:0 8px;border-radius:var(--r-state);border:1px solid var(--line-strong);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip .ic{width:12px;height:12px;vertical-align:0}
.chip-good{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.chip-warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chip-crit{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
.chip-info{color:var(--uplink);border-color:var(--uplink);background:var(--uplink-soft)}
.chip-neon{color:var(--neon);border-color:var(--neon);background:var(--neon-soft)}
.chip-sun{color:var(--sunset);border-color:var(--sunset);background:var(--sunset-soft)}
:root[data-mode="noon"] .chip-good,:root[data-mode="noon"] .chip-warn,:root[data-mode="noon"] .chip-crit{color:var(--status-ink);border-color:transparent}
.chip.fill{color:var(--neon-ink)}
.chip.nodot::before{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:var(--Hc);padding:0 9px;border-radius:var(--r-record);background:var(--panel-3);
  border:1px solid var(--line);font-size:12px;color:var(--ink);white-space:nowrap}
.tag .ic{width:12px;height:12px;color:var(--uplink)}
.tag.click{cursor:pointer}
.tag.click:hover{border-color:var(--uplink)}
.stamp{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.star{display:inline-block;width:18px;height:18px;background:var(--sunset);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-4px;flex:none}
.star.lg{width:44px;height:44px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:11px;color:var(--dim)}
.field .err{font-size:11px;color:var(--crit);display:none}
.field.invalid .err{display:block}
.field.invalid .input{border-color:var(--crit)}
.input{height:var(--H);width:100%;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-record);background:var(--bg-deep);color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--uplink);box-shadow:0 0 0 3px var(--uplink-soft)}
.input::placeholder{color:var(--dim)}
textarea.input{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.45}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inwrap{position:relative}
.inwrap>.ic{position:absolute;left:11px;top:9px;color:var(--dim)}
.inwrap .input{padding-left:36px}
.inwrap .tail{position:absolute;right:4px;top:4px}
.switch{--w:40px;position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .k{width:var(--w);height:22px;border-radius:var(--r-pill);background:var(--panel-3);border:1px solid var(--line-strong);position:relative;transition:background .2s;flex:none}
.switch .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked+.k{background:var(--neon-soft);border-color:var(--neon)}
.switch input:checked+.k::after{transform:translateX(18px);background:var(--neon);box-shadow:var(--glow)}
.switch input:focus-visible+.k{outline:2px solid var(--uplink);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px}
.check input{width:16px;height:16px;accent-color:var(--neon);margin:0}
.radio-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.radio-card{border:1px solid var(--line-strong);border-radius:var(--r-record);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--panel-2)}
.radio-card input{position:absolute;opacity:0}
.radio-card:has(input:checked){border-color:var(--neon);box-shadow:var(--tube);background:var(--neon-soft)}
.radio-card:has(input:focus-visible){outline:2px solid var(--uplink);outline-offset:2px}
.radio-card b{font-size:13px}
.range{width:100%;accent-color:var(--neon)}
.swatches{display:flex;gap:8px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line-strong)}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:5px;border-radius:var(--r-state);background:var(--panel-3)}
.meter[data-s="1"] i:nth-child(-n+1){background:var(--crit)}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-s="3"] i:nth-child(-n+3){background:var(--uplink)}
.meter[data-s="4"] i:nth-child(-n+4){background:var(--good)}
.drop-zone{border:2px dashed var(--line-strong);border-radius:var(--r-card);padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg-deep)}
.drop-zone.over{border-color:var(--uplink);background:var(--uplink-soft);color:var(--ink)}
.drop-zone .ic{width:28px;height:28px;color:var(--uplink);display:block;margin:0 auto 8px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;background:var(--panel-2);
  position:sticky;top:0;cursor:pointer;user-select:none}
.tbl th .ic{width:12px;height:12px;margin-left:4px;color:var(--dim);vertical-align:-2px}
.tbl th[aria-sort] .ic{color:var(--uplink)}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr[aria-selected="true"]{background:var(--neon-soft)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.id{font-family:var(--font-mono);color:var(--uplink);font-size:12px}
.tbl td.money{font-family:var(--font-mono);text-align:right}
.tbl th.money{text-align:right}
.tbl .tname{font-weight:700}
.tbl .tname small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.risk{display:inline-flex;gap:3px}
.risk i{width:5px;height:12px;border-radius:1px;background:var(--panel-3)}
.risk[data-r="1"] i:nth-child(1){background:var(--good)}
.risk[data-r="2"] i:nth-child(-n+2){background:var(--warn)}
.risk[data-r="3"] i:nth-child(-n+3){background:var(--crit)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.toolbar .inwrap{flex:1 1 220px;max-width:340px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:28px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--uplink-soft);border-color:var(--uplink);color:var(--uplink)}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--neon);border-radius:var(--r-record);background:var(--neon-soft);margin-bottom:12px}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.pager .pg{width:28px;height:28px;border-radius:var(--r-record);border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--font-mono)}
.pager .pg[aria-current="page"]{border-color:var(--uplink);color:var(--uplink)}
.pager .pg:hover{background:var(--panel-2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .display{color:var(--sunset);margin-bottom:6px}
.empty .ic{width:36px;height:36px;color:var(--leather);display:block;margin:0 auto 10px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.kcol.over{border-color:var(--uplink);background:var(--uplink-soft)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.kcol-h .cnt{margin-left:auto}
.kcard{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-record);padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard[data-pri="hot"]{border-left-color:var(--neon)}
.kcard[data-pri="warm"]{border-left-color:var(--sunset)}
.kcard[data-pri="cold"]{border-left-color:var(--uplink)}
.kcard b{font-size:13px}
.kcard .foot{display:flex;align-items:center;gap:6px;margin-top:2px}
.kadd{border:1px dashed var(--line-strong);background:transparent;color:var(--muted);border-radius:var(--r-record);height:32px;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.kadd:hover{color:var(--ink);border-color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel);overflow:hidden;min-height:520px}
.chan{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--bg-deep)}
.chan a{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:var(--r-record);color:var(--muted);text-decoration:none;font-family:var(--font-mono);font-size:12px}
.chan a[aria-current="true"]{background:var(--neon-soft);color:var(--ink)}
.chan a .cnt{margin-left:auto;font-size:10px;color:var(--neon)}
.thread{display:flex;flex-direction:column;min-height:0}
.thread .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:420px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.msg .who{display:flex;align-items:baseline;gap:8px}
.msg .who b{font-size:12px}
.msg .who time{font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.msg p{margin:2px 0 0;max-width:62ch}
.msg.me{grid-template-columns:minmax(0,1fr) 32px}
.msg.me .body{text-align:right}
.msg.me p{margin-left:auto;background:var(--neon-soft);border:1px solid color-mix(in srgb,var(--neon) 35%,transparent);padding:6px 10px;border-radius:var(--r-record);display:inline-block;text-align:left}
.msg .react{display:inline-flex;gap:4px;margin-top:4px}
.msg .react button{height:20px;padding:0 6px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-size:10px;cursor:pointer;font-family:var(--font-mono)}
.typing{font-family:var(--font-mono);font-size:11px;color:var(--dim);padding:0 14px 6px;min-height:18px}
.typing i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--uplink);margin-right:2px;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer .input{flex:1}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;padding:4px 0}
.cal .day{aspect-ratio:1;max-width:100%;min-height:52px;border:1px solid var(--line);border-radius:var(--r-record);padding:6px;background:var(--panel-2);cursor:pointer;
  display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:left}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--neon);box-shadow:var(--tube)}
.cal .day[aria-pressed="true"]{border-color:var(--uplink);background:var(--uplink-soft)}
.cal .day .n{font-family:var(--font-mono);font-size:11px}
.cal .day .ev{height:4px;border-radius:2px;background:var(--uplink)}
.cal .day .ev.sun{background:var(--sunset)}.cal .day .ev.neon{background:var(--neon)}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev-row{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-record);background:var(--panel-2)}
.ev-row i{border-radius:2px;background:var(--uplink)}
.ev-row.sun i{background:var(--sunset)}.ev-row.neon i{background:var(--neon)}

/* wanted poster */
.wanted{position:relative;padding:22px;border:3px double var(--leather);border-radius:4px;background:
  repeating-linear-gradient(0deg,transparent 0 6px,rgba(181,113,62,.05) 6px 7px),var(--panel);text-align:center}
.wanted::before{content:"";position:absolute;inset:6px;border:1px solid var(--leather);opacity:.5;pointer-events:none}
.wanted .w-head{font-family:var(--font-display);font-size:34px;letter-spacing:.08em;color:var(--sunset);line-height:1}
.wanted .w-sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.wanted .avatar.lg{margin:16px auto 10px;border:3px solid var(--leather)}
.wanted .w-name{font-size:22px;font-weight:700}
.wanted .w-reward{font-family:var(--font-display);font-size:20px;color:var(--neon);text-shadow:var(--glow);margin-top:10px}
.wanted .w-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--leather)}
.wanted .w-stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{height:var(--H);padding:0 14px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border-radius:var(--r-opener)}
.tabs button[aria-selected="true"]{color:var(--neon);border-bottom-color:var(--neon);background:var(--neon-soft)}
.sess{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r-record);background:var(--panel-2)}
.sess .ic{color:var(--uplink)}
.sess b{display:block;font-size:12px}
.sess small{color:var(--muted);font-family:var(--font-mono);font-size:10px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.plan.hot{border-color:var(--neon);box-shadow:var(--tube)}
.plan .pn{font-family:var(--font-display);font-size:20px;color:var(--sunset)}
.plan .pp{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .pp small{font-size:11px;color:var(--muted);font-weight:400;font-family:var(--font-mono)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.plan ul li::before{content:"› ";color:var(--uplink)}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t{flex:1;min-width:0}
.setrow .t b{display:block;font-size:13px}
.setrow .t small{color:var(--muted);font-size:12px}
.setrow .input{max-width:220px}
.danger{border-color:var(--crit)}
.danger .panel-h .title{color:var(--crit)}
.keyrow{display:flex;gap:8px;align-items:center}
.keyrow code{flex:1;font-family:var(--font-mono);font-size:12px;padding:0 12px;height:var(--H);display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-record);background:var(--bg-deep);color:var(--uplink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.integ{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.integ:last-child{border-bottom:0}
.integ .logo{width:34px;height:34px;border-radius:var(--r-record);display:grid;place-items:center;background:var(--panel-3);color:var(--uplink);flex:none}
.integ .t{flex:1}.integ .t b{display:block}.integ .t small{color:var(--muted)}

/* activity / lists */
.feed{display:flex;flex-direction:column;gap:0}
.feed-i{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:start}
.feed-i:last-child{border-bottom:0}
.feed-i .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel-3);color:var(--uplink)}
.feed-i .ico.neon{color:var(--neon)}.feed-i .ico.sun{color:var(--sunset)}.feed-i .ico.good{color:var(--good)}.feed-i .ico.crit{color:var(--crit)}
.feed-i .ico .ic{width:13px;height:13px}
.feed-i p{margin:0;font-size:12px}.feed-i time{font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.lb{display:flex;flex-direction:column;gap:10px}
.lb-row{display:grid;grid-template-columns:20px 28px minmax(0,1fr) 70px;gap:10px;align-items:center}
.lb-row .rk{font-family:var(--font-mono);font-size:11px;color:var(--dim);text-align:right}
.lb-row .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .bar{margin-top:3px}
.lb-row .sc{font-family:var(--font-mono);font-size:11px;text-align:right;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{height:64px;border:1px solid var(--line);border-radius:var(--r-record);background:var(--panel-2);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.quick button .ic{color:var(--uplink)}
.quick button:hover{border-color:var(--uplink);background:var(--uplink-soft)}
.weather{display:flex;align-items:center;gap:14px}
.weather .big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.weather .big small{font-size:14px;color:var(--muted);font-weight:400}
.weather .ic-lg{width:40px;height:40px;color:var(--sunset)}
.ring{width:84px;height:84px;position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--panel-3)}
.ring .fg{stroke:var(--uplink);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{font-family:var(--font-mono);font-size:15px}

/* chart */
.chart{position:relative}
.chart svg{width:100%;height:190px;display:block;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-dasharray:2 4}
.chart .bar-r{fill:var(--uplink);opacity:.85;transition:opacity .1s}
.chart .bar-r.hot{fill:var(--neon)}
.chart .bar-r:hover,.chart .bar-r.on{opacity:1}
.chart text{font-family:var(--font-mono);font-size:10px;fill:var(--dim)}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel-3);border:1px solid var(--line-strong);border-radius:var(--r-record);padding:6px 10px;font-family:var(--font-mono);font-size:11px;transform:translate(-50%,-110%);white-space:nowrap;box-shadow:var(--shadow)}
.chart .tip b{color:var(--uplink)}
.legend{display:flex;gap:14px;font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px;background:var(--uplink)}
.legend i.hot{background:var(--neon)}

/* overlays: modal, palette, dropdowns, toasts, tooltips */
.veil{position:fixed;inset:0;background:rgba(8,4,14,.7);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
:root[data-mode="noon"] .veil{background:rgba(60,40,10,.45)}
.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow);animation:pop .18s;max-height:calc(100vh - 40px);overflow:auto}
.modal.wide{width:min(720px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h .display{flex:1;font-size:20px;color:var(--sunset)}
.modal-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.palette{width:min(600px,100%);align-self:start;margin-top:8vh;background:var(--panel);border:1px solid var(--uplink);border-radius:var(--r-card);box-shadow:var(--shadow),var(--glow-uplink);overflow:hidden;animation:pop .18s}
.palette .inwrap .input{border:0;border-bottom:1px solid var(--line);border-radius:0;height:52px;font-size:15px;background:transparent;padding-left:44px}
.palette .inwrap .input:focus{box-shadow:none}
.palette .inwrap .ic{top:17px;left:14px}
.plist{max-height:min(380px,50vh);overflow:auto;padding:6px}
.pgroup{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 10px 4px}
.pitem{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:var(--r-record);cursor:pointer;color:var(--ink)}
.pitem .ic{color:var(--uplink)}
.pitem[aria-selected="true"]{background:var(--neon-soft);outline:1px solid color-mix(in srgb,var(--neon) 40%,transparent)}
.pitem small{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.pfoot{display:flex;gap:14px;padding:8px 12px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.drop{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow);z-index:60;animation:pop .15s;overflow:hidden}
.drop.menu{width:220px}
.drop-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.drop-h .title{flex:1}
.drop .item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:var(--ink);font:inherit}
.drop .item:hover{background:var(--panel-2)}
.drop .item .ic{color:var(--muted)}
.drop .item.danger{color:var(--crit)}
.drop .item.danger .ic{color:var(--crit)}
.drop .sep{border-top:1px solid var(--line)}
.ntf{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px dashed var(--line);cursor:pointer}
.ntf:hover{background:var(--panel-2)}
.ntf i{width:8px;height:8px;border-radius:50%;background:var(--neon);margin-top:5px;box-shadow:var(--glow)}
.ntf.read i{background:transparent;box-shadow:none;border:1px solid var(--line-strong)}
.ntf b{font-size:12px;display:block}.ntf p{margin:2px 0 0;font-size:12px;color:var(--muted)}.ntf time{font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.hasdrop{position:relative}
.hasdrop>.btn{position:relative}
.toasts{position:fixed;right:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:120;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line-strong);border-left:3px solid var(--uplink);border-radius:var(--r-record);box-shadow:var(--shadow);animation:slide .2s;font-size:12px}
.toast.good{border-left-color:var(--good)}.toast.warn{border-left-color:var(--warn)}.toast.crit{border-left-color:var(--crit)}.toast.neon{border-left-color:var(--neon)}
.toast .ic{color:var(--uplink)}.toast.good .ic{color:var(--good)}.toast.warn .ic{color:var(--warn)}.toast.crit .ic{color:var(--crit)}.toast.neon .ic{color:var(--neon)}
.toast .t{flex:1;min-width:0}
.toast .t b{display:block}
@keyframes slide{from{transform:translateX(20px);opacity:0}}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--panel-3);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r-record);padding:4px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;white-space:nowrap;z-index:70;pointer-events:none}
.banner{position:fixed;left:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));z-index:110;background:var(--panel);border:1px solid var(--leather);border-radius:var(--r-card);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;animation:slide .3s}
.banner .ic{color:var(--sunset);width:22px;height:22px}
.banner p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:105;display:flex;flex-direction:column;animation:drawer .2s;padding-top:env(safe-area-inset-top,0px)}
@keyframes drawer{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-b{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.cl-i{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.cl-i ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.step i{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-style:normal;font-size:11px}
.step.on{color:var(--ink)}.step.on i{border-color:var(--neon);color:var(--neon);box-shadow:var(--glow)}
.step.done i{background:var(--good);border-color:var(--good);color:var(--bg)}
.stepper .ln{flex:1;height:1px;background:var(--line-strong)}
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel-3) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:shimmer 1.1s infinite;border-radius:var(--r-record);min-height:14px}
@keyframes shimmer{to{background-position:-200% 0}}
.statusbar{position:fixed;left:236px;right:0;bottom:0;height:calc(34px + env(safe-area-inset-bottom,0px));padding:0 16px env(safe-area-inset-bottom,0px);z-index:35;display:flex;align-items:center;gap:16px;
  background:var(--bg-deep);border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);overflow:hidden;white-space:nowrap}
.statusbar b{color:var(--muted);font-weight:400}
.statusbar .live{color:var(--good)}
.statusbar .ml{margin-left:auto}
.notfound{text-align:center;padding:60px 20px}
.notfound .display-xl{color:var(--sunset);font-size:44px}
.notfound .code{font-family:var(--font-mono);font-size:80px;color:var(--neon);text-shadow:var(--glow);line-height:1;letter-spacing:.1em}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--skyline),var(--bg)}
.login .card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:26px;box-shadow:var(--shadow);position:relative}
.login .card::before,.login .card::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--neon);opacity:.9}
.login .card::before{top:-2px;left:-2px;border-width:2px 0 0 2px;border-top-left-radius:var(--r-card)}
.login .card::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0;border-bottom-right-radius:var(--r-card)}
.login .wordmark{font-size:38px;text-align:center}
.login .wordmark small{font-size:11px}
.login form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.login .social{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login .or{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
.login .or::before,.login .or::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
.login .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.flicker{animation:flick 2.2s steps(1,end) 1}
@keyframes flick{0%,4%,8%{opacity:.35}2%,6%,10%,100%{opacity:1}22%{opacity:.6}24%{opacity:1}}

/* responsive */
.menu-btn{display:none}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .side-veil{position:fixed;inset:0;background:rgba(8,4,14,.6);z-index:39}
  .menu-btn{display:inline-flex}
  .statusbar{left:0}
  .main{padding:16px 16px 84px}
  .top{padding:0 12px}
  .searchbtn{min-width:0;flex:1}
  .searchbtn span.ph{display:none}
  .uplink span{display:none}
  .chat{grid-template-columns:1fr}
  .chan{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .kanban{grid-template-columns:repeat(4,minmax(240px,1fr))}
}
@media (max-width:560px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .value{font-size:24px}
  .display{font-size:20px}
  .wanted .w-head{font-size:26px}

}

<script>
/* ── theme ── */
const ACCENTS={
  neon:{night:['#ff2e88','#120c1c','rgba(255,46,136,.16)','255,46,136'],noon:['#b0104f','#f7eedb','rgba(176,16,79,.12)','176,16,79'],label:'Neon magenta'},

};
function applyTheme(){
  const r=document.documentElement;const noon=S.mode==='noon';
  r.dataset.mode=noon?'noon':'night';r.dataset.fx=S.fx?'on':'off';
  const a=ACCENTS[S.accent]||ACCENTS.neon;const v=noon?a.noon:a.night;
  r.style.setProperty('--neon',v[0]);r.style.setProperty('--neon-ink',v[1]);r.style.setProperty('--neon-soft',v[2]);

  store.set('mode',S.mode);store.set('fx',S.fx);store.set('accent',S.accent);store.set('glow',S.glow);

/* ── small view helpers ── */
const av=(c,cls='')=>`<span class="avatar ${cls} ${c.on?'on':''}" data-hue style="--h:${hue(c.name)}" title="${esc(c.name)}">${initials(c.name)}</span>`;

const dateOf=d=>new Date(Date.now()+d*864e5);
const shortDate=d=>d.toLocaleDateString('en-US',{month:'short',day:'2-digit'});
const clock=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};

const unreadN=()=>S.notifs.filter(n=>!n.read).length;
function spark(arr,color){const w=260,h=36,mx=Math.max(...arr),mn=Math.min(...arr);const pts=arr.map((v,i)=>[i/(arr.length-1)*w,h-4-((v-mn)/(mx-mn||1))*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3" fill="${color}"/></svg>`}
const SCRIP14=[1200,3400,900,5600,2100,7800,450,300,4200,650,9900,1800,700,3400];
function chartHtml(){const data=SCRIP14,W=560,H=190,L=40,B=22,T=10,R=6,max=10000,iw=(W-L-R)/data.length,bw=iw*.62;const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scrip earned over the last 14 days">`;
  for(const g of[0,2500,5000,7500,10000])s+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}"/><text x="${L-6}" y="${(y(g)+3).toFixed(1)}" text-anchor="end">${g?g/1000+'k':'0'}</text>`;
  data.forEach((v,i)=>{const x=L+i*iw+(iw-bw)/2,d=dateOf(i-13);s+=`<rect class="bar-r ${i===13?'hot':''}" data-i="${i}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="2"><title>${shortDate(d)}: ${fmt(v)} §</title></rect>`;
    if(i%2===1)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${shortDate(d)}</text>`});
  return s+'</svg><div class="tip" id="chart-tip" hidden></div>'}

/* bounty board */
function tblRows(){const t=S.tbl;let rows=S.bounties.filter(b=>t.status==='all'||b.status===t.status);const q=t.q.trim().toLowerCase();
  if(q)rows=rows.filter(b=>(b.id+' '+b.title+' '+b.poster+' '+b.sector+' '+(b.who?crew(b.who).name:'')).toLowerCase().includes(q));
  const key=t.sort;rows.sort((a,b)=>{let x=a[key],y=b[key];if(key==='who'){x=x?crew(x).name:'~';y=y?crew(y).name:'~'}if(typeof x==='string')return x.localeCompare(y)*t.dir;return (x-y)*t.dir});return rows}
function tableHtml(){const t=S.tbl,all=tblRows(),pages=Math.max(1,Math.ceil(all.length/t.per));if(t.page>pages)t.page=pages;const rows=all.slice((t.page-1)*t.per,t.page*t.per);
  const th=(k,l,cls='')=>`<th class="${cls}" data-act="tbl-sort" data-v="${k}" ${t.sort===k?`aria-sort="${t.dir>0?'ascending':'descending'}"`:''}>${l}${ic(t.sort===k?(t.dir>0?'arrow-up':'arrow-down'):'arrow-up-down')}</th>`;
  const counts=s=>s==='all'?S.bounties.length:S.bounties.filter(b=>b.status===s).length;
  return `<div class="toolbar"><div class="inwrap">${ic('search')}<input class="input" id="tbl-q" placeholder="Search bounties, posters, sectors…" value="${esc(t.q)}" data-on="tbl-q"></div>
    <div class="fchips">${['all',...STATUSES].map(s=>`<button class="fchip" data-act="tbl-filter" data-v="${s}" aria-pressed="${t.status===s}">${s==='all'?'All':STATUS_META[s][0]} <span class="dim">${counts(s)}</span></button>`).join('')}</div>
    <select class="input ml" style="width:auto;height:28px;padding:0 28px 0 10px;font-size:11px" data-ch="tbl-per" aria-label="Rows per page">${[5,8,12,50].map(n=>`<option ${t.per===n?'selected':''} value="${n}">${n} / page</option>`).join('')}</select></div>
  ${t.sel.size?`<div class="bulk">${ic('lasso')}<b class="small">${t.sel.size} roped</b><button class="btn btn-sm btn-neon" data-act="bulk-claim">Claim all</button><button class="btn btn-sm btn-danger" data-act="bulk-void">Void</button><button class="btn btn-sm btn-ghost ml" data-act="bulk-clear">Let 'em go</button></div>`:''}
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:36px;cursor:default"><input type="checkbox" aria-label="Select page" data-ch="tbl-selall" ${rows.length&&rows.every(r=>t.sel.has(r.id))?'checked':''}></th>${th('id','ID')}${th('title','Bounty')}${th('sector','Sector')}${th('risk','Risk')}${th('reward','Reward','money')}${th('status','Status')}${th('who','Rider')}${th('due','Due')}<th style="width:44px;cursor:default"></th></tr></thead>
  <tbody>${rows.length?rows.map(b=>`<tr aria-selected="${t.sel.has(b.id)}"><td><input type="checkbox" aria-label="Select ${b.id}" data-ch="tbl-sel" data-v="${b.id}" ${t.sel.has(b.id)?'checked':''}></td><td class="id"><a href="#bounties/${b.id}" data-act="tbl-open" data-v="${b.id}" style="text-decoration:none">${b.id}</a></td><td class="tname" style="white-space:normal;min-width:220px">${esc(b.title)}<small>posted by ${esc(b.poster)}</small></td><td>${esc(b.sector)}</td><td>${riskEl(b.risk)}</td><td class="money num">${scrip(b.reward)}</td><td>${chipFor(b.status)}</td><td>${b.who?`<span class="row" style="gap:6px">${av(crew(b.who),'sm')}<span class="small">${esc(crew(b.who).name)}</span></span>`:'<span class="dim">—</span>'}</td><td class="num small">${shortDate(dateOf(b.due))}</td><td class="hasdrop"><button class="btn btn-ghost btn-icon btn-sm" data-act="row-menu" data-v="${b.id}" aria-label="Actions for ${b.id}">${ic('ellipsis','ic-sm')}</button>${S.rowMenu===b.id?`<div class="drop menu" id="drop" style="right:8px"><button class="item" data-act="tbl-claim" data-v="${b.id}">${ic('hand')} Claim it</button><button class="item" data-act="tbl-done" data-v="${b.id}">${ic('circle-check')} Mark done</button><button class="item" data-act="tbl-copy" data-v="${b.id}">${ic('copy')} Copy id</button><div class="sep"></div><button class="item danger" data-act="tbl-void" data-v="${b.id}">${ic('ban')} Void it</button></div>`:''}</td></tr>`).join('')
    :`<tr><td colspan="10"><div class="empty">${ic('wind')}<div class="display">Nothing but tumbleweeds.</div><span>No bounty matches that. Loosen the filter or post one.</span></div></td></tr>`}</tbody></table>

function threadHtml(){const list=S.msgs[S.chan]||[];return list.map(m=>{const me=m.who==='me';const c=me?S.user:crew(m.who);const d=new Date(m.at);return `<div class="msg ${me?'me':''}">${me?'':av(c,'')}<div class="body"><div class="who" style="${me?'justify-content:flex-end':''}"><b>${esc(c.name)}</b><time>${pad(d.getHours())}:${pad(d.getMinutes())}</time></div><p>${esc(m.t)}</p>${m.react?`<div class="react">${m.react.map(r=>`<button data-act="react">${r}</button>`).join('')}</div>`:''}</div>${me?av(c,''):''}</div>`}).join('')}

/* almanac */
function seedEvents(){const d=new Date(),y=d.getFullYear(),m=d.getMonth();const k=(day)=>`${y}-${pad(m+1)}-${pad(day)}`;return [{d:k(3),t:'Water convoy leaves 04:00',k:'sun'},{d:k(8),t:'Sheriff\'s poker night',k:'neon'},{d:k(14),t:'Rig inspection',k:''},{d:k(d.getDate()),t:'Dust storm, Chrome Mesa 21:00',k:'sun'},{d:k(27),t:'Payday (allegedly)',k:'neon'}]}
S.events=seedEvents();
VIEWS.almanac=()=>{const c=S.cal;const first=new Date(c.y,c.m,1),start=first.getDay(),days=new Date(c.y,c.m+1,0).getDate(),prevDays=new Date(c.y,c.m,0).getDate();const today=new Date();const key=d=>`${c.y}-${pad(c.m+1)}-${pad(d)}`;
  let cells='';for(let i=0;i<42;i++){const n=i-start+1;const out=n<1||n>days;const dn=out?(n<1?prevDays+n:n-days):n;const evs=out?[]:S.events.filter(e=>e.d===key(n));const isT=!out&&today.getFullYear()===c.y&&today.getMonth()===c.m&&today.getDate()===n;
    cells+=`<button class="day ${out?'out':''} ${isT?'today':''}" ${!out&&c.sel===n?'aria-pressed="true"':''} data-act="cal-day" data-v="${out?'':n}" ${out?'disabled':''}><span class="n">${dn}</span>${evs.slice(0,2).map(e=>`<span class="ev ${e.k}"></span>`).join('')}</button>`}
  const sel=S.events.filter(e=>e.d===key(c.sel));const selDate=new Date(c.y,c.m,c.sel);
  return ph('Almanac // <b>'+first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</b>','The Almanac','Convoys, storms, poker nights. Tap a day to see what\'s riding in.',`<button class="btn btn-neon" data-act="cal-add">${ic('plus')} Add event</button>`)+
  `<div class="grid g-main"><div class="panel hud"><div class="panel-h"><button class="btn btn-ghost btn-icon btn-sm" data-act="cal-prev" aria-label="Previous month">${ic('chevron-left','ic-sm')}</button><span class="title" style="text-align:center">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span><button class="btn btn-ghost btn-icon btn-sm" data-act="cal-next" aria-label="Next month">${ic('chevron-right','ic-sm')}</button><button class="btn btn-ghost btn-sm" data-act="cal-today">Today</button></div>
    <div class="cal">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>
  <div class="stack"><div class="panel"><div class="panel-h"><span class="title">${selDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span><span class="stamp">${sel.length} riding in</span></div><div class="evlist">${sel.length?sel.map(e=>`<div class="ev-row ${e.k}"><i></i><div><b class="small">${esc(e.t)}</b><div class="tiny">${e.k==='sun'?'Weather / convoy':e.k==='neon'?'Social':'Maintenance'}</div></div></div>`).join(''):'<div class="empty small" style="padding:20px">Quiet day. Enjoy it, they\'re rare.</div>'}</div></div>
    <div class="panel flat"><div class="panel-h"><span class="title">Pick a date</span></div><div class="field"><label for="dp">Date picker</label><input type="date" class="input" id="dp" value="${key(c.sel)}" data-ch="cal-pick"></div><div class="hint muted small" style="margin-top:8px">A native date picker, wearing the console's colours via color-scheme.</div></div></div></div>`};

    <div class="label" style="margin:12px 0 8px">Saddled devices</div><div class="stack" style="gap:8px">${[['smartphone','Rig terminal · Mustang MkII','This device · Sector 7 · now',true],['laptop','Doc\'s workbench slate','Chrome Mesa · 2 h ago',false],['monitor','Saloon wall console','Neon Gulch · 3 d ago',false]].map((s,i)=>`<div class="sess" id="sess-${i}">${ic(s[0])}<div style="flex:1"><b>${s[1]}</b><small>${s[2]}</small></div>${s[3]?'<span class="chip chip-good">This one</span>':`<button class="btn btn-sm btn-ghost" data-act="sess-revoke" data-v="${i}">Revoke</button>`}</div>`).join('')}</div>

    <div class="w-stats"><div><b class="num">41</b><span class="tiny">Bounties</span></div><div><b class="num">128</b><span class="tiny">Rides</span></div><div><b><span class="star" style="width:14px;height:14px;vertical-align:-1px"></span> ${esc(u.rank||'Drifter')}</b><span class="tiny">Rank</span></div></div></div>

  <div class="panel"><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${S.tab===t[0]}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}</div></div>`};

  </div><div class="stack">
