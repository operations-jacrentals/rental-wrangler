  `<div class="grid g-main"><div class="panel"><div class="panel-h"><span class="title">Frequently hollered questions</span></div><div class="stack" style="gap:6px">${[['Why does the town clock strike thirteen?','It was rigged that way in 0.9.1 as a joke and now three bounties depend on it. Debugging it is itself a bounty. Claim it if you dare.'],['What is scrip?','Company money that works everywhere the company reaches, which out here is everywhere. The § is silent.'],['Can I run two rigs?','On Ranger, three. On Drifter, one, and it had better be the Mule.'],['Who is the sheriff?','Sheriff Okonkwo. She posts bounties, she pays on time, she does not answer the wire after nine.'],['Why is everything pink?','That\'s the neon. Try High Noon in the Rig if you want paper and rust instead.']].map(q=>`<details class="panel flat" style="padding:10px 14px"><summary style="cursor:pointer;font-weight:600">${q[0]}</summary><p class="muted small" style="margin:8px 0 0;max-width:62ch">${q[1]}</p></details>`).join('')}</div></div>
  <div class="stack"><div class="panel hud"><div class="panel-h"><span class="title">Keyboard</span></div><div class="stack" style="gap:8px">${SHORTCUTS.map(s=>`<div class="row between small"><span class="muted">${s[1]}</span><kbd>${s[0]}</kbd></div>`).join('')}</div></div>
  <div class="panel"><div class="panel-h"><span class="title">Status</span></div><div class="row between small"><span class="muted">Uplink</span><span class="chip chip-good">Nominal</span></div><div class="row between small" style="margin-top:6px"><span class="muted">Jukebox</span><span class="chip chip-good">Humming</span></div><div class="row between small" style="margin-top:6px"><span class="muted">Town clock</span><span class="chip chip-warn">Strikes 13</span></div><div class="row between small" style="margin-top:6px"><span class="muted">Coyotes</span><span class="chip chip-crit">Chatty</span></div></div></div></div>`;
const notFound=()=>`<div class="notfound"><div class="code">404</div><h1 class="display display-xl">This trail's gone cold.</h1><p class="muted">There's no page at <code class="mono">#${esc(location.hash.slice(1))}</code>. Could be a dead link, could be a ghost.</p><div class="row" style="justify-content:center;margin-top:16px"><a class="btn btn-neon" href="#overwatch">${ic('layout-dashboard')} Back to Overwatch</a><button class="btn btn-ghost" data-act="palette">${ic('search')} Whistle for it</button></div></div>`;
</script>
<script>
/* ── overlays ── */
let toastN=0;
function toast(title,body='',kind='',action){const id='t'+(++toastN);const el=document.createElement('div');el.className='toast '+kind;el.id=id;
  el.innerHTML=`${ic({good:'circle-check',warn:'triangle-alert',crit:'circle-alert',neon:'sparkles'}[kind]||'info')}<div class="t"><b>${esc(title)}</b>${body?`<span class="muted">${esc(body)}</span>`:''}</div>${action?`<button class="btn btn-sm btn-uplink" data-act="toast-action" data-v="${id}">${esc(action.label)}</button>`:''}<button class="btn btn-ghost btn-icon btn-sm" data-act="toast-close" data-v="${id}" aria-label="Dismiss">${ic('x','ic-sm')}</button>`;
  el._action=action&&action.fn;const st=$('#toasts');st.appendChild(el);while(st.children.length>4)st.firstChild.remove();icons();setTimeout(()=>el.remove(),action?7000:4500)}
let modalResolve=null;
function openModal(inner,{wide=false}={}){$('#overlay').innerHTML=`<div class="veil" data-act="veil"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${inner}</div></div>`;icons();const f=$('#overlay .modal input:not([type=hidden]),#overlay .modal textarea,#overlay .modal select,#overlay .modal button');f&&f.focus()}
function closeOverlay(){$('#overlay').innerHTML='';if(modalResolve){const r=modalResolve;modalResolve=null;r(false)}}
function confirmDlg({title,body,ok='Do it',danger=false,typed=null}){return new Promise(res=>{modalResolve=res;
  openModal(`<div class="modal-h"><span class="display">${esc(title)}</span>${closeBtn()}</div><div class="modal-b"><p style="margin:0" class="muted">${body}</p>${typed?`<div class="field"><label for="typed">Type <b>${esc(typed)}</b> to confirm</label><input class="input" id="typed" autocomplete="off"></div>`:''}</div><div class="modal-f"><button class="btn btn-ghost" data-act="close">Hold your horses</button><button class="btn ${danger?'btn-danger':'btn-neon'}" data-act="modal-ok" id="modal-ok" ${typed?'disabled':''}>${esc(ok)}</button></div>`);
  if(typed)$('#typed').addEventListener('input',e=>{$('#modal-ok').disabled=e.target.value.trim()!==typed})})}
function bountyModal(b){const c=b.who?crew(b.who):null;openModal(`<div class="modal-h"><span class="display">${esc(b.title)}</span>${chipFor(b.status)}${closeBtn()}</div><div class="modal-b"><p class="muted" style="margin:0">${esc(b.desc)}</p>
  <div class="grid g2" style="gap:10px"><div><div class="label">Posted by</div><b class="small">${esc(b.poster)}</b></div><div><div class="label">Reward</div><b class="num">${scrip(b.reward)}</b></div><div><div class="label">Sector</div><span class="tag">${ic('map-pin')}${esc(b.sector)}</span></div><div><div class="label">Risk</div>${riskEl(b.risk)}</div><div><div class="label">Due</div><b class="small num">${shortDate(dateOf(b.due))}</b></div><div><div class="label">Rider</div>${c?`<span class="row" style="gap:6px">${av(c,'sm')}<span class="small">${esc(c.name)}</span></span>`:'<span class="dim">Unclaimed</span>'}</div></div></div>
  <div class="modal-f"><button class="btn btn-ghost" data-act="close">Close</button><button class="btn btn-ghost" data-act="tbl-copy" data-v="${b.id}">${ic('copy','ic-sm')} Copy id</button>${b.status==='open'?`<button class="btn btn-neon" data-act="tbl-claim" data-v="${b.id}">${ic('hand','ic-sm')} Claim it</button>`:b.status==='claimed'||b.status==='riding'?`<button class="btn btn-neon" data-act="tbl-done" data-v="${b.id}">${ic('circle-check','ic-sm')} Mark done</button>`:''}</div>`)}
function newBountyModal(){openModal(`<form data-form="bounty"><div class="modal-h"><span class="display">Post a bounty</span>${closeBtn()}</div><div class="modal-b">
  <div class="field" id="nb-f-title"><label for="nb-title">What needs doing</label><input class="input" id="nb-title" placeholder="Find the Cartwright horse" maxlength="80"><div class="err">A bounty needs a job.</div></div>
  <div class="grid g2" style="gap:10px"><div class="field" id="nb-f-reward"><label for="nb-reward">Reward (§)</label><input class="input num" id="nb-reward" type="number" min="1" step="50" placeholder="1200"><div class="err">Nobody rides for free.</div></div><div class="field"><label for="nb-due">Due</label><input class="input" id="nb-due" type="date" value="${dateOf(5).toISOString().slice(0,10)}"></div>
  <div class="field"><label for="nb-sector">Sector</label><select class="input" id="nb-sector">${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="nb-risk">Risk</label><select class="input" id="nb-risk"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select></div></div>
  <div class="field"><label for="nb-desc">Details</label><textarea class="input" id="nb-desc" placeholder="Where, when, what it looks like, what to avoid."></textarea></div></div>
  <div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close">Never mind</button><button class="btn btn-neon" type="submit">${ic('scroll-text','ic-sm')} Post it</button></div></form>`)}
function eventModal(){const c=S.cal;openModal(`<form data-form="event"><div class="modal-h"><span class="display">Add to the almanac</span>${closeBtn()}</div><div class="modal-b"><div class="field" id="ev-f-t"><label for="ev-t">What's riding in</label><input class="input" id="ev-t" placeholder="Convoy leaves at dawn"><div class="err">Give it a name.</div></div><div class="grid g2" style="gap:10px"><div class="field"><label for="ev-d">Day</label><input class="input" id="ev-d" type="date" value="${c.y}-${pad(c.m+1)}-${pad(c.sel)}"></div><div class="field"><label for="ev-k">Kind</label><select class="input" id="ev-k"><option value="">Maintenance</option><option value="sun">Weather / convoy</option><option value="neon">Social</option></select></div></div></div><div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close">Never mind</button><button class="btn btn-neon" type="submit">Add it</button></div></form>`)}
function shortcutsModal(){openModal(`<div class="modal-h"><span class="display">Shortcuts</span>${closeBtn()}</div><div class="modal-b"><div class="stack" style="gap:8px">${SHORTCUTS.map(s=>`<div class="row between small"><span class="muted">${s[1]}</span><kbd>${s[0]}</kbd></div>`).join('')}</div></div><div class="modal-f"><button class="btn btn-ghost" data-act="close">Got it</button></div>`)}
function openDrawer(){$('#overlay').innerHTML=`<div class="veil" data-act="veil" style="place-items:stretch end;padding:0"><div class="drawer" role="dialog" aria-modal="true"><div class="drawer-h"><span class="display" style="flex:1;font-size:20px;color:var(--sunset)">What's new</span>${closeBtn()}</div><div class="drawer-b">${CHANGELOG.map((c,i)=>`<div class="cl-i"><span class="chip ${i?'':'chip-neon'} nodot">v${c[0]}</span><div><b class="small">${i?'':'Latest · '}${['Jukebox &amp; High Noon','Bounty Board tools','Corral &amp; palette'][i]}</b><ul><li>${esc(c[1])}</li></ul></div></div>`).join('')}<hr class="wire"><p class="small muted" style="margin:0">Older releases are carved on a rock outside town. Bring a lantern.</p></div></div></div>`;icons()}
function palItems(){const items=[];
  for(const[k,r]of Object.entries(ROUTES))items.push({g:'Pages',t:r[0],ic:r[1],k:'#'+k,run:()=>{location.hash=k}});
  [['Post a bounty','plus',()=>newBountyModal()],['Toggle High Noon','sun-moon',()=>ACT.mode()],[S.plugged?'Unplug the rig':'Plug in the rig','plug',()=>ACT.plug()],[S.juke.playing?'Pause the jukebox':'Play the jukebox','music',()=>ACT['juke-toggle']()],['Mark the wire read','bell-off',()=>ACT['ntf-readall']()],['Keyboard shortcuts','keyboard',()=>shortcutsModal()],['What\'s new','sparkles',()=>openDrawer()],['Ride off (sign out)','log-out',()=>ACT.logout()]].forEach(a=>items.push({g:'Actions',t:a[0],ic:a[1],run:()=>{closeOverlay();a[2]()}}));
  S.bounties.forEach(b=>items.push({g:'Bounties',t:b.title,ic:'scroll-text',k:b.id,run:()=>{closeOverlay();bountyModal(b)}}));
  CREW.forEach(c=>items.push({g:'Riders',t:c.name,ic:'user-round',k:c.role,run:()=>{closeOverlay();toast(c.name,`${c.role} · ${c.on?'at the bar':'dark'} · ${fmt(c.score)} §`,'')}}));
  return items}
function palFiltered(){const q=S.pal.q.trim().toLowerCase();const all=palItems();if(!q)return all;return all.filter(it=>{const t=(it.t+' '+(it.k||'')).toLowerCase();if(t.includes(q))return true;let j=0;for(const ch of t){if(ch===q[j])j++;if(j===q.length)return true}return false})}
function paintPal(){const list=palFiltered();const el=$('#pal-list');if(!el)return;if(!list.length){el.innerHTML=`<div class="empty">${ic('wind')}<div class="display">Nothing but tumbleweeds.</div><span>No match for “${esc(S.pal.q)}”.</span></div>`;icons();return}
  if(S.pal.i>=list.length)S.pal.i=list.length-1;let g='';el.innerHTML=list.map((it,i)=>{let h='';if(it.g!==g){g=it.g;h=`<div class="pgroup">${g}</div>`}return h+`<div class="pitem" role="option" aria-selected="${i===S.pal.i}" data-act="pal-pick" data-v="${i}">${ic(it.ic)}<span>${esc(it.t)}</span>${it.k?`<small>${esc(it.k)}</small>`:''}</div>`}).join('');icons();const on=$('.pitem[aria-selected="true"]',el);on&&on.scrollIntoView({block:'nearest'})}
function openPalette(){if($('#pal-q'))return;S.pal={q:'',i:0};$('#overlay').innerHTML=`<div class="veil" data-act="veil" style="align-items:start"><div class="palette" role="dialog" aria-modal="true"><div class="inwrap">${ic('search')}<input class="input" id="pal-q" placeholder="Whistle for a page, a bounty, a rider, an action…" autocomplete="off" spellcheck="false"></div><div class="plist" id="pal-list" role="listbox"></div><div class="pfoot"><span>↑↓ ride</span><span>↵ pick</span><span>esc close</span><span class="ml">${palItems().length} things</span></div></div></div>`;icons();paintPal();const q=$('#pal-q');q.focus();q.addEventListener('input',e=>{S.pal.q=e.target.value;S.pal.i=0;paintPal()})}

/* ── render ── */
function render(skel){const app=$('#app');S.drop=null;S.rowMenu=null;S.kMenu=null;
  if(!S.user){app.innerHTML=loginView();icons();$('#login-user')?.focus();return}
  if(!S.onboarded){app.innerHTML=onboardView();icons();return}
  app.innerHTML=`<div class="shell">${sideHtml()}<div style="min-width:0">${topHtml()}<main class="main" id="main">${skel?skeleton():''}</main></div></div>${statusHtml()}${S.consent?'':bannerHtml()}`;icons();
  if(skel&&!reduced)setTimeout(paint,160);else paint()}
function paint(){const m=$('#main');if(!m)return;const v=view();m.innerHTML=(VIEWS[v]||notFound)();icons();if(v==='saloon'){const ms=$('#msgs');ms&&(ms.scrollTop=ms.scrollHeight)}}
function repaintShell(){const side=$('#side');if(side){side.outerHTML=sideHtml();$('.side-veil')?.remove()}const top=$('.top');top&&(top.outerHTML=topHtml());icons()}
function repaintTable(){const a=$('#tbl-area');a&&(a.innerHTML=tableHtml(),icons())}
function login(name){const handle=name.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')||'stranger';const disp=name.split(/[.\s_]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'Stranger';
  S.user={name:disp,handle,rank:'Drifter',on:true};if($('#login-rem')?.checked!==false)store.set('user',S.user);toast('Jacked in.',`Howdy, ${disp}. The wire's been waiting.`,'good');if(!location.hash||location.hash==='#')location.hash='#overwatch';render(true)}

/* ── actions (click) ── */
const ACT={
  peek(el){const i=$('#login-pass');i.type=i.type==='password'?'text':'password';el.innerHTML=ic(i.type==='password'?'eye':'eye-off','ic-sm');icons()},
  forgot(){toast('Key recovery','Out here we just make a new one. Type anything and jack in.','warn')},
  social(el){const b=el;b.disabled=true;b.innerHTML=`<span class="spin"></span> ${el.dataset.v}…`;setTimeout(()=>login(el.dataset.v==='NetLink'?'dusty.vector':'ma.ravenholt'),900)},
  signup(){toast('Same door.','Any handle you type becomes your poster. No forms, no waiting.','')},
  'ob-back'(){S.ob.step--;render()},'ob-skip'(){S.onboarded=true;store.set('onboarded',true);render(true)},
  'side-open'(){S.sideOpen=true;repaintShell()},'side-close'(){S.sideOpen=false;repaintShell()},
  palette(){openPalette()},
  mode(){S.mode=S.mode==='noon'?'night':'noon';applyTheme();render();toast(S.mode==='noon'?'High Noon.':'Night falls.',S.mode==='noon'?'Paper and rust. Neon\'s off till sundown.':'Tubes are lit.','')},
  drop(el){S.drop=S.drop===el.dataset.v?null:el.dataset.v;repaintShell()},
  'drop-close'(){S.drop=null;repaintShell()},
  'ntf-readall'(){S.notifs.forEach(n=>n.read=true);S.drop=null;repaintShell();toast('Wire cleared.','','good')},
  'ntf-open'(el){const n=S.notifs.find(x=>x.id===el.dataset.v);n.read=true;S.drop=null;repaintShell();toast(n.t,n.p,'')},
  whatsnew(){S.drop=null;repaintShell();openDrawer()},shortcuts(){S.drop=null;repaintShell();shortcutsModal()},
  async logout(){S.drop=null;repaintShell();if(!await confirmDlg({title:'Ride off?',body:'You\'ll be signed out of this rig. Your poster stays on the wall.',ok:'Ride off'}))return;S.user=null;store.del('user');S.onboarded=false;store.del('onboarded');S.ob=null;render()},
  consent(){S.consent=true;store.set('consent',true);$('#banner')?.remove()},
  plug(){S.plugged=!S.plugged;repaintShell();$('#main')&&view()==='overwatch'&&paint();toast(S.plugged?'Rig plugged in.':'Rig unplugged.',S.plugged?'Charging. It stopped screaming.':'It will remember this.',S.plugged?'good':'warn')},
  'juke-toggle'(){S.juke.playing=!S.juke.playing;S.juke.playing?audioStart():audioStop();repaintShell()},
  'juke-next'(){S.juke.i=(S.juke.i+1)%TRACKS.length;S.juke.pos=0;repaintShell();if(S.juke.playing)audioStart()},
  'juke-prev'(){S.juke.i=(S.juke.i+TRACKS.length-1)%TRACKS.length;S.juke.pos=0;repaintShell();if(S.juke.playing)audioStart()},
  'new-bounty'(){newBountyModal()},
  async export(){const csv=['id,title,poster,sector,risk,reward,status,due',...S.bounties.map(b=>[b.id,`"${b.title.replace(/"/g,'""')}"`,`"${b.poster}"`,b.sector,b.risk,b.reward,b.status,dateOf(b.due).toISOString().slice(0,10)].join(','))].join('\n');
    try{await navigator.clipboard.writeText(csv);toast('Ledger copied as CSV.',`${S.bounties.length} rows on your clipboard. Downloads are corralled in this preview.`,'good')}catch(e){toast('Clipboard\'s locked.','Select the board and copy it the old way.','warn')}},
  quick(el){const v=el.dataset.v;({sheriff:()=>toast('Sheriff pinged.','Okonkwo says: "After nine? Bold."','neon'),gate:()=>toast('Gate\'s open.','Sixty seconds, then it closes on whatever\'s in it.','warn'),ride:()=>toast('Ride logged.','128 rides. Sal is still ahead of you.','good'),
    diag:()=>{toast('Running diagnostics…','','');setTimeout(()=>toast('All systems nominal.','Except the town clock. Still thirteen.','good'),1400)},brand:()=>{location.hash='corral'}})[v]()},
  'tbl-sort'(el){const k=el.dataset.v;const t=S.tbl;if(t.sort===k)t.dir*=-1;else{t.sort=k;t.dir=1}repaintTable()},
  'tbl-filter'(el){S.tbl.status=el.dataset.v;S.tbl.page=1;repaintTable()},
  'tbl-page'(el){S.tbl.page=+el.dataset.v;repaintTable()},
  'tbl-open'(el,e){e.preventDefault();bountyModal(S.bounties.find(b=>b.id===el.dataset.v))},
  'row-menu'(el){S.rowMenu=S.rowMenu===el.dataset.v?null:el.dataset.v;repaintTable()},
  'tbl-claim'(el){const b=S.bounties.find(x=>x.id===el.dataset.v);b.status='claimed';b.who='u1';S.rowMenu=null;closeOverlay();repaintTable();repaintShell();toast('Claimed.',`${b.title} is yours. Ride safe.`,'neon')},
  'tbl-done'(el){const b=S.bounties.find(x=>x.id===el.dataset.v);b.status='done';S.rowMenu=null;closeOverlay();repaintTable();repaintShell();toast('Bounty done.',`${fmt(b.reward)} § landing on the wire.`,'good')},
  'tbl-void'(el){const b=S.bounties.find(x=>x.id===el.dataset.v);const was=b.status;b.status='void';S.rowMenu=null;repaintTable();repaintShell();toast('Voided.',b.title,'warn',{label:'Undo',fn:()=>{b.status=was;repaintTable();repaintShell()}})},
  async 'tbl-copy'(el){try{await navigator.clipboard.writeText(el.dataset.v);toast('Copied '+el.dataset.v,'','good')}catch(e){toast('Clipboard\'s locked.','','warn')}S.rowMenu=null;repaintTable()},
  'bulk-claim'(){const n=S.tbl.sel.size;S.bounties.filter(b=>S.tbl.sel.has(b.id)&&b.status==='open').forEach(b=>{b.status='claimed';b.who='u1'});S.tbl.sel.clear();repaintTable();repaintShell();toast(`${n} claimed.`,'Greedy. Respect.','neon')},
  'bulk-void'(){const n=S.tbl.sel.size;S.bounties.filter(b=>S.tbl.sel.has(b.id)).forEach(b=>b.status='void');S.tbl.sel.clear();repaintTable();repaintShell();toast(`${n} voided.`,'','warn')},
  'bulk-clear'(){S.tbl.sel.clear();repaintTable()},
  async 'k-add'(el){const pen=el.dataset.v;openModal(`<form data-form="kcard" data-pen="${pen}"><div class="modal-h"><span class="display">Rope a card</span>${closeBtn()}</div><div class="modal-b"><div class="field" id="kc-f"><label for="kc-t">What is it</label><input class="input" id="kc-t" placeholder="Fix the porch light"><div class="err">Needs words.</div></div><div class="field"><label for="kc-p">Heat</label><select class="input" id="kc-p"><option value="cold">Cold</option><option value="warm" selected>Warm</option><option value="hot">Hot</option></select></div></div><div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close">Never mind</button><button class="btn btn-neon" type="submit">Rope it</button></div></form>`)},
  'k-menu'(el){S.kMenu=S.kMenu===el.dataset.v?null:el.dataset.v;paint()},
  'k-move'(el){const[id,pen]=el.dataset.v.split('|');const c=S.cards.find(x=>x.id===id);c.pen=pen;S.kMenu=null;paint();toast('Moved to '+PENS.find(p=>p[0]===pen)[1]+'.','',pen==='shipped'?'good':'')},
  'k-del'(el){const i=S.cards.findIndex(x=>x.id===el.dataset.v);const[c]=S.cards.splice(i,1);S.kMenu=null;paint();toast('Branded and burned.',c.t,'crit',{label:'Undo',fn:()=>{S.cards.splice(i,0,c);paint()}})},
  chan(el,e){e.preventDefault();S.chan=el.dataset.v;const ch=CHANNELS.find(c=>c[0]===S.chan);ch[2]=0;paint();repaintShell()},
  react(el){el.textContent=el.textContent.replace(/\d+$/,n=>+n+1);toast('Reacted.','','')},
  attach(){toast('Attachments','Drop a file on the composer. Or don\'t, it\'s a saloon.','')},
  'cal-prev'(){const c=S.cal;c.m--;if(c.m<0){c.m=11;c.y--}c.sel=1;paint()},'cal-next'(){const c=S.cal;c.m++;if(c.m>11){c.m=0;c.y++}c.sel=1;paint()},
  'cal-today'(){const d=new Date();S.cal={y:d.getFullYear(),m:d.getMonth(),sel:d.getDate()};paint()},
  'cal-day'(el){if(!el.dataset.v)return;S.cal.sel=+el.dataset.v;paint()},'cal-add'(){eventModal()},
  tab(el){S.tab=el.dataset.v;paint()},
  'prof-reset'(){paint();toast('Discarded.','Poster\'s back how it was.','')},
  dz(el){$('#dz-file',el)?.click()},
  'sess-revoke'(el){const s=$('#sess-'+el.dataset.v);s.style.opacity='.4';el.disabled=true;el.textContent='Revoked';toast('Session revoked.','That device will have to jack in again.','good')},
  async 'rideoff-all'(){if(!await confirmDlg({title:'Ride off everywhere?',body:'Every device gets signed out, this one included. Your poster stays up.',ok:'Do it',danger:true}))return;S.user=null;store.del('user');S.onboarded=false;store.del('onboarded');S.ob=null;render();toast('Signed out everywhere.','','good')},
  async bury(){if(!await confirmDlg({title:'Bury this account?',body:'Boot Hill is permanent. Bounties you posted stay posted. Scrip you\'re owed gets paid to the sheriff, who will not give it back.',ok:'Bury it',danger:true,typed:S.user.handle}))return;toast('Buried.','Well. Almost. This is a sandbox, so: signed out instead.','crit');S.user=null;store.del('user');S.onboarded=false;store.del('onboarded');S.ob=null;render()},
  'set-accent'(el){S.accent=el.dataset.v;applyTheme();paint();toast(ACCENTS[S.accent].label+'.','Every action wears it now.','neon')},
  plan(el){toast('Plan change','Talk to the sheriff. She handles upgrades, and she\'s off after nine.','warn')},
  integ(el){const[i,name]=el.dataset.v.split('|');S.integ=S.integ||{};const cur=S.integ[i]??[true,true,false,false][i];S.integ[i]=!cur;paint();toast(cur?name+' disconnected.':name+' connected.','',cur?'warn':'good')},
  async 'key-copy'(){try{await navigator.clipboard.writeText($('#apikey').textContent);toast('Key copied.','Holster it.','good')}catch(e){toast('Clipboard\'s locked.','','warn')}},
  async 'key-regen'(){if(!await confirmDlg({title:'Regenerate the key?',body:'The old key dies everywhere the moment you do. Halcyon will call.',ok:'Regenerate',danger:true}))return;S.apikey='ng_live_'+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6);paint();toast('New key minted.','The old one is ash.','good')},
  veil(el,e){if(e.target===el)closeOverlay()},close(){closeOverlay()},
  'modal-ok'(){const r=modalResolve;modalResolve=null;$('#overlay').innerHTML='';r&&r(true)},
  'pal-pick'(el){const it=palFiltered()[+el.dataset.v];it&&it.run()},
  'toast-action'(el){const t=$('#'+el.dataset.v);t._action&&t._action();t.remove()},'toast-close'(el){$('#'+el.dataset.v)?.remove()},
};
/* input / change / submit handlers */
const ON={
  'ob-name'(el){S.ob.name=el.value},'ob-handle'(el){S.ob.handle=el.value.toLowerCase().replace(/[^a-z0-9.]/g,'')},
  'tbl-q'(el){S.tbl.q=el.value;S.tbl.page=1;const a=$('#tbl-area');const q=el;const pos=q.selectionStart;repaintTable();const n=$('#tbl-q');n&&(n.focus(),n.setSelectionRange(pos,pos))},
  'set-glow'(el){S.glow=+el.value;applyTheme()},
  count(el){$('#bio-n').textContent=el.value.length},
  pw(el){const v=el.value;let s=0;if(v.length>=8)s++;if(v.length>=14)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d|[^\w]/.test(v))s++;if(!v)s=0;$('#pw-meter').dataset.s=s;$('#pw-hint').textContent=['Longer beats clever. A sentence works.','Weak. A coyote could guess it.','Getting there.','Solid.','Iron. Nobody\'s cracking that.'][s]},
};
const CH={
  'ob-rig'(el){S.ob.rig=el.value},'ob-pref'(el){S.ob.prefs[el.dataset.v]=el.checked},
  'tbl-per'(el){S.tbl.per=+el.value;S.tbl.page=1;repaintTable()},
  'tbl-sel'(el){el.checked?S.tbl.sel.add(el.dataset.v):S.tbl.sel.delete(el.dataset.v);repaintTable()},
  'tbl-selall'(el){const rows=tblRows().slice((S.tbl.page-1)*S.tbl.per,S.tbl.page*S.tbl.per);rows.forEach(r=>el.checked?S.tbl.sel.add(r.id):S.tbl.sel.delete(r.id));repaintTable()},
  'cal-pick'(el){const[y,m,d]=el.value.split('-').map(Number);if(!y)return;S.cal={y,m:m-1,sel:d};paint()},
  pref(el){S.prefs[el.dataset.v]=el.checked;store.set('prefs',S.prefs);if(el.dataset.v==='quiet')paint();if(el.dataset.v==='twofa')toast(el.checked?'Second key armed.':'Second key holstered.','',el.checked?'good':'warn');if(el.dataset.v==='sound'&&!el.checked)audioStop()},
  'set-mode'(){ACT.mode()},'set-fx'(el){S.fx=el.checked;applyTheme()},
  'dz-file'(el){fileIn(el.files&&el.files[0])},
};
function fileIn(f){if(!f)return;const out=$('#dz-out');if(!out)return;out.hidden=false;$('#dz-name').textContent=`${f.name} · ${(f.size/1024).toFixed(0)} KB`;const bar=$('#dz-bar');let p=0;const t=setInterval(()=>{p=Math.min(100,p+rnd(8,22));bar.style.width=p+'%';if(p>=100){clearInterval(t);toast('Uploaded.',f.name,'good')}},120)}
const FORMS={
  login(f){const u=$('#login-user'),p=$('#login-pass');let ok=true;$('#f-user').classList.toggle('invalid',!u.value.trim());$('#f-pass').classList.toggle('invalid',!p.value);if(!u.value.trim()||!p.value){(!u.value.trim()?u:p).focus();return}const b=$('#login-go');b.disabled=true;b.innerHTML='<span class="spin"></span> Jacking in…';setTimeout(()=>login(u.value.trim()),800)},
  ob(){const o=S.ob;if(o.step<3){if(o.step===1&&!(o.name||'').trim()){toast('Need a name.','Even "Stranger" is a name.','warn');return}o.step++;render();return}
    S.user={...S.user,name:o.name.trim(),handle:o.handle||S.user.handle,rig:RIGS.find(r=>r[0]===o.rig)[1]};store.set('user',S.user);S.prefs={...S.prefs,...o.prefs};store.set('prefs',S.prefs);S.onboarded=true;store.set('onboarded',true);render(true);toast('Saddled up.',`${S.user.rig}, tuned wire, and a poster on the wall.`,'good')},
  chat(){const i=$('#chat-in');const t=i.value.trim();if(!t)return;(S.msgs[S.chan]=S.msgs[S.chan]||[]).push({who:'me',t,at:Date.now()});i.value='';const ms=$('#msgs');ms.innerHTML=threadHtml();icons();ms.scrollTop=ms.scrollHeight;
    const who=pick(CREW.filter(c=>c.on));const ty=$('#typing');ty.innerHTML=`${esc(who.name)} is typing <i></i><i></i><i></i>`;
    setTimeout(()=>{ty.innerHTML='';S.msgs[S.chan].push({who:who.id,t:pick(['Copy that.','Ha. Bring the good lantern.','Roped. On it after the convoy.','Say that again on the wire, the saloon\'s loud.','Sheriff won\'t like it. Do it anyway.','The clock just struck thirteen again.','Tumbleweed says no.']),at:Date.now()});const m2=$('#msgs');if(m2){m2.innerHTML=threadHtml();icons();m2.scrollTop=m2.scrollHeight}},rnd(1400,2600))},
  bounty(){const t=$('#nb-title'),r=$('#nb-reward');let ok=true;$('#nb-f-title').classList.toggle('invalid',!t.value.trim());$('#nb-f-reward').classList.toggle('invalid',!(+r.value>0));if(!t.value.trim()||!(+r.value>0))return;
    const due=Math.max(0,Math.round((new Date($('#nb-due').value||Date.now())-Date.now())/864e5));const b={id:'BNT-'+(Math.max(...S.bounties.map(x=>+x.id.slice(4)))+7),title:t.value.trim(),desc:$('#nb-desc').value.trim()||'No details. Ask around.',poster:S.user.name,reward:+r.value,sector:$('#nb-sector').value,risk:+$('#nb-risk').value,status:'open',due,who:null};
    S.bounties.unshift(b);closeOverlay();S.tbl.page=1;S.tbl.status='all';if(view()==='bounties')repaintTable();else location.hash='bounties';repaintShell();toast('Bounty posted.',`${b.id} · ${fmt(b.reward)} §`,'neon',{label:'Undo',fn:()=>{S.bounties=S.bounties.filter(x=>x!==b);repaintTable();repaintShell()}})},
  event(){const t=$('#ev-t');if(!t.value.trim()){$('#ev-f-t').classList.add('invalid');return}S.events.push({d:$('#ev-d').value,t:t.value.trim(),k:$('#ev-k').value});const[y,m,d]=$('#ev-d').value.split('-').map(Number);S.cal={y,m:m-1,sel:d};closeOverlay();paint();toast('Added to the almanac.',t.value.trim(),'good')},
  kcard(f){const t=$('#kc-t');if(!t.value.trim()){$('#kc-f').classList.add('invalid');return}S.cards.push({id:'k'+Date.now(),pen:f.dataset.pen,t:t.value.trim(),pri:$('#kc-p').value,who:'u1'});closeOverlay();paint();toast('Roped.',t.value.trim(),'good')},
  profile(){S.user={...S.user,name:$('#p-name').value.trim()||S.user.name,handle:$('#p-handle').value.trim()||S.user.handle,bio:$('#p-bio').value,sector:$('#p-sector').value};store.set('user',S.user);render();toast('Poster saved.','Nailed to the saloon wall.','good')},
  pass(){const a=$('#pw1'),b=$('#pw2');const bad=!a.value||a.value!==b.value;b.closest('.field').classList.toggle('invalid',bad);if(bad)return;a.value=b.value='';$('#pw-meter').dataset.s=0;toast('Passkey changed.','Old one\'s in Boot Hill.','good')},
};

/* ── event wiring ── */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
  if(!el){if(S.drop&&!e.target.closest('.drop')){S.drop=null;repaintShell()}if(S.rowMenu&&!e.target.closest('.drop')){S.rowMenu=null;repaintTable()}if(S.kMenu&&!e.target.closest('.drop')){S.kMenu=null;paint()}return}
  const fn=ACT[el.dataset.act];if(!fn)return;if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();fn(el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-on]');el&&ON[el.dataset.on]&&ON[el.dataset.on](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');el&&CH[el.dataset.ch]&&CH[el.dataset.ch](el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form]&&FORMS[f.dataset.form](f)});
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal-q')?closeOverlay():openPalette();return}
  if(e.key==='Escape'){if($('#overlay').innerHTML){closeOverlay();return}if(S.drop||S.rowMenu||S.kMenu){S.drop=null;S.rowMenu=null;S.kMenu=null;repaintShell();repaintTable();}if(S.sideOpen){S.sideOpen=false;repaintShell()}return}
  if($('#pal-q')){const list=palFiltered();if(e.key==='ArrowDown'){e.preventDefault();S.pal.i=Math.min(list.length-1,S.pal.i+1);paintPal()}else if(e.key==='ArrowUp'){e.preventDefault();S.pal.i=Math.max(0,S.pal.i-1);paintPal()}else if(e.key==='Enter'){e.preventDefault();list[S.pal.i]&&list[S.pal.i].run()}return}
  if(typing||!S.user||!S.onboarded||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(S.gPending){S.gPending=false;if(k==='o')location.hash='overwatch';if(k==='b')location.hash='bounties';if(k==='c')location.hash='corral';if(k==='s')location.hash='saloon';return}
  if(k==='g'){S.gPending=true;setTimeout(()=>S.gPending=false,900);return}
  if(e.key==='?'){shortcutsModal();return}if(k==='n'){newBountyModal();return}if(k==='t'){ACT.mode();return}if(k==='/'){e.preventDefault();openPalette()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kcard');if(!c)return;S.drag=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id)}catch(x){}});
document.addEventListener('dragend',()=>{$$('.kcard.dragging').forEach(c=>c.classList.remove('dragging'));$$('.kcol.over,.drop-zone.over').forEach(c=>c.classList.remove('over'))});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.kcol,.drop-zone');if(!z)return;e.preventDefault();z.classList.add('over')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.kcol,.drop-zone');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.kcol,.drop-zone');if(!z)return;e.preventDefault();z.classList.remove('over');
  if(z.classList.contains('drop-zone')){fileIn(e.dataTransfer.files&&e.dataTransfer.files[0]);return}
  const id=S.drag||e.dataTransfer.getData('text/plain');const c=S.cards.find(x=>x.id===id);S.drag=null;if(c&&c.pen!==z.dataset.pen){c.pen=z.dataset.pen;paint();toast('Moved to '+PENS.find(p=>p[0]===c.pen)[1]+'.','',c.pen==='shipped'?'good':'')}});
document.addEventListener('mousemove',e=>{const r=e.target.closest&&e.target.closest('.bar-r');const tip=$('#chart-tip');if(!tip)return;if(!r){tip.hidden=true;$$('.bar-r.on').forEach(b=>b.classList.remove('on'));return}
  const i=+r.dataset.i;const box=$('#chart').getBoundingClientRect(),rb=r.getBoundingClientRect();tip.hidden=false;tip.innerHTML=`${shortDate(dateOf(i-13))} · <b>${fmt(SCRIP14[i])} §</b>`;tip.style.left=(rb.left-box.left+rb.width/2)+'px';tip.style.top=(rb.top-box.top)+'px';$$('.bar-r.on').forEach(b=>b.classList.remove('on'));r.classList.add('on')});
window.addEventListener('hashchange',()=>{if(S.sideOpen)S.sideOpen=false;render(true);const m=location.hash.match(/^#bounties\/(BNT-\d+)/);if(m){const b=S.bounties.find(x=>x.id===m[1]);b&&setTimeout(()=>bountyModal(b),200)}});

/* ── timers ── */
setInterval(()=>{const c=$('#clock');c&&(c.textContent=clock())},1000);
setInterval(()=>{S.latency=Math.max(18,Math.min(190,S.latency+rnd(-9,9)+(Math.random()<.06?rnd(40,90):0)));const l=$('#lat'),l2=$('#lat2'),u=$('#uplink');l&&(l.textContent=S.latency+' ms');l2&&(l2.textContent=S.latency+' ms');u&&(u.className='uplink '+(S.latency>140?'down':S.latency>80?'weak':''))},2500);
setInterval(()=>{if(!S.plugged||S.charge>=100)return;S.charge=Math.min(100,S.charge+1);const n=$('#charge-n'),b=$('#charge-bar'),rn=$('#ring-n'),rf=$('#ring-fg'),rk=$('#ring-km');n&&(n.textContent=S.charge+'%');b&&(b.style.width=S.charge+'%');rn&&(rn.textContent=S.charge+'%');rf&&(rf.style.strokeDashoffset=(226.2*(1-S.charge/100)).toFixed(1));rk&&(rk.textContent=Math.round(S.charge*3.2)+' km');
  if(S.charge===20||S.charge===100){repaintShell();if(S.charge===100)toast('Rig fully charged.','It has forgiven you.','good')}},700);
setInterval(()=>{if(!S.juke.playing)return;const t=TRACKS[S.juke.i];S.juke.pos++;if(S.juke.pos>=t[2]){ACT['juke-next']();return}const b=$('#juke-bar'),n=$('#juke-t');b&&(b.style.width=(S.juke.pos/t[2]*100).toFixed(1)+'%');n&&(n.textContent=mmss(S.juke.pos))},1000);

/* ── jukebox synth (WebAudio, five notes, no samples) ── */
let AC=null,seq=null;
function audioStart(){audioStop();if(!S.prefs.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();const base=[110,130.8,146.8,164.8,196][S.juke.i%5];const scale=[1,1.2,1.5,1.667,2,2.4,3];let step=0;
  const master=AC.createGain();master.gain.value=.08;master.connect(AC.destination);
  const drone=AC.createOscillator(),df=AC.createBiquadFilter(),dg=AC.createGain();drone.type='sawtooth';drone.frequency.value=base/2;df.type='lowpass';df.frequency.value=220;dg.gain.value=.5;drone.connect(df).connect(dg).connect(master);drone.start();
  seq={master,drone,timer:setInterval(()=>{const f=base*scale[[0,2,3,4,2,5,3,1][step%8]]*(step%16>=8?1.5:1);const o=AC.createOscillator(),g=AC.createGain();o.type=step%4===0?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.6,AC.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.32);o.connect(g).connect(master);o.start();o.stop(AC.currentTime+.35);step++},300)}}catch(e){seq=null}}
function audioStop(){if(!seq)return;try{clearInterval(seq.timer);seq.drone.stop();seq.master.disconnect()}catch(e){}seq=null}

/* ── boot ── */
applyTheme();render(true);
</script>
