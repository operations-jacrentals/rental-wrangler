<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>c11 — L bracket</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="./c11-l-bracket.css">
<style>
  /* Preview-page scaffolding only — never affects the component itself. */
  body {
    display: block;
    min-height: 100vh;
    padding: 48px 32px 96px;
    background: #05070a;
    font-family: var(--sans);
  }
  h1 {
    color: #8a8f99;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .swatch {
    margin-bottom: 40px;
  }
  .swatch .stage {
    position: relative;
    width: 1088px;
    max-width: 100%;
    height: 150px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  figcaption {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: #6b7078;
    letter-spacing: .02em;
  }
  figcaption b {
    color: #9aa0aa;
    font-weight: 600;
  }
  figcaption code {
    color: #8a8f99;
  }
</style>
</head>
<body>
  <h1>halo-c11-l-bracket — every variant</h1>

  <figure class="swatch">
    <div class="stage">
      <div class="halo-c11-l-bracket" style="--x:24px; --y:24px;">
        <i class="c11-div"></i>
        <i class="c11-vertical"></i>
        <i class="c11-tip"></i>
        <i class="c11-elbow"></i>
      </div>
    </div>
    <figcaption>
      <b>base</b> — the only variant: 1 instance in the whole canvas (band B).
      vars set: <code>--x:24px --y:24px</code> (root position only — every
      other measurement in this component is fixed, matching the original).
      Structure: <code>.c11-div</code> (horizontal, painted first) →
      <code>.c11-vertical</code> + <code>.c11-tip</code> (the upright stroke
      and its cap) → <code>.c11-elbow</code> (the 43.5&deg; turn, painted
      last so it sits over the divider's left end — that overlap is
      intentional, see the CSS header).
    </figcaption>
  </figure>

</body>
</html>
