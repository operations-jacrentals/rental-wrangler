<!--
  ===========================================================================
  THE SUBITEM — band B's lower row, rebuilt entirely from separated parts

  Canvas span: x 1..1288, y 241..378 (plus c3's elbow, which straddles up to
  y 213).  Six parts, in paint order:

      c13-banner-shell   the shared card housing  (see THE SHELL, below)
      c9-circuit-field   etched copper field + microtext, at the left
      c3-conduit         instance C3b, the conduit elbow (saturate(.9))
      c4-panel-frame     instance C4b, the sub-panel  (HAS the .pf-lift child)
      c12-marks          the hex icon and the "Skid Ste..." name
      c2-segment-bars    instance C2c, 5 bars R R R Y Y
      c1-status-chip     instance C1c, the narrow PROMISED chip

  Not one visual value is written on this page or in subitem.css.  Every
  colour, gradient, blur, stop and offset comes from the part sheets; this
  page supplies markup + placement and nothing else.

  ---------------------------------------------------------------------------
  THE ROW IS A UNIT

  The six parts live inside one `.halo-subitem` root, positioned at (--x,--y)
  — here its true canvas origin (1, 241).  Every part inside is placed as
  canvas-minus-(1,241) by subitem.css, so the whole row relocates by changing
  those two numbers and nothing else.  main-item.css does the same with its
  own (1, 125) origin, which is what lets main-plus-subitem.html stack the two
  rows 116px apart on one shell.

  Keep --x/--y INTEGERS.  c1 pins its filtered ring <svg> to a whole screen
  pixel with mod(var(--x),1px) and bakes the leftover fraction into the ring
  path's `d`; a fractionally-positioned ancestor puts that blur back off-grid.

  ---------------------------------------------------------------------------
  THE SHELL IS NOT THIS ROW'S — READ THIS BEFORE REUSING IT

  c13-banner-shell is the CARD's housing, not the Subitem's.  One shell, one
  1287x254 box at canvas (1,125), spans the WHOLE of band B: the Main Item
  row (y 125..241) sits in its top half and the Subitem row (y 241..378) sits
  in its bottom half.  It belongs to neither row and both rows need it under
  them, because every part above it composites against its face.

  So it is a SIBLING of .halo-subitem, never a child.  It is included here
  only so this page's backdrop is honest — a Subitem floating on bare --bg
  would composite differently and would be a lie.  On
  THIS page it carries the extra class `clip-to-subitem`, which crops it to
  canvas rows 241..378 so the page does not display 116 rows of housing that
  belong to the row above.  (241, not 242 — the two rows SHARE that scanline:
  c5's FAILED plate ends on it and c9's field begins on it.  Cropping at 242
  cost mean 6.455 / max 141 on the 1063x1 @ (0,241) window below; see
  subitem.css.)  On assembly/main-plus-subitem.html — where both
  rows are present — that class is NOT applied and the whole shell shows, as
  it must.  If you lift this row into a real card, the shell comes from the
  CARD, not from here.

  ---------------------------------------------------------------------------
  WHY THIS PAGE CARRIES A FULL 1292x635 STAGE

  So the pixel gate is honest.  A band-sized stage rasterises fractionally
  positioned, clip-pathed boxes onto a different pixel grid — measured on the
  ORIGINAL's own untouched markup, shifted by an integer offset and nothing
  else: 1292x140 stage -> mean 0.228 / max 83; 1292x268 -> 0.059 / 8;
  1292x635 -> 0.000 / 0.  A harness with a floor of 0.228 can hide a real 1px
  defect, so this page carries the canvas's own stage, every part sits at its
  TRUE canvas coordinate, and the gate runs with --full.  (ANATOMY.md, "The
  stage width changes the pixels".)

  ---------------------------------------------------------------------------
  THE GATE — two windows, because one honest rectangle does not exist

    A   python3 ../_ref/check.py ./subitem.html 1292 140 0 242 --full
    B   python3 ../_ref/check.py ./subitem.html 1063   1 0 241 --full

  A = canvas x 0, y 242, w 1292, h 140 (rows 242..381): the whole row plus
      three pure-background rows below it, full canvas width, so nothing can
      spill sideways or downward unseen.
  B = canvas x 0, y 241, w 1063, h 1: the shared scanline, stopping at x1063
      where c5's C5b FAILED plate — a Main Item part — starts.

  Neither window is a guess.  Both were validated first against a masked copy
  of original.html (the whole header row deleted): inside each, that copy
  scores mean 0.000 / max 0 against original.png, which is what proves the
  reference pixels there are the shell + these six parts and nothing else.
  Window A stops at 242 rather than 241 for exactly that reason.

  WHAT IS NOT GATED HERE, and why: canvas rows 213..240 of c3's elbow, and
  row 241 right of x1063.  In the reference those pixels are Main Item paint
  (c10's banner face; c5's plate), so no Subitem-only page can match them —
  the elbow genuinely straddles the two rows.  They are gated on
  assembly/main-plus-subitem.html, whose window (0,118,1292,268) covers all
  of band B and passes at mean 0.000 / max 0.  Between the two pages every
  pixel this row paints is proven.
  ===========================================================================
-->
