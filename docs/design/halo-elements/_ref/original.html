<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halo Design Elements — HTML/CSS recreation</title>
<style>
/* ==========================================================================
   HALO DESIGN ELEMENTS — pure HTML/CSS recreation of "Halo Design Elements.svg"

   Canvas 1292 x 635 = the artwork's own pixel scale.
   Three bands:  A  parts, y   0..109
                 B  assembled banner, y 125..378
                 C  parts, y 394..623
   Every effect is built by stacking translucent layers; no images are used.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0c10;

  /* red family */
  --neon:      #f95a5c;   /* status-chip outline core   */
  --neon-hi:   #ff7a76;
  --bar-red:   #ff433e;   /* segment bar fill           */
  --brk-red:   #fc6c5c;   /* banner L-bracket core      */
  --pnl-red:   #fa756f;   /* panel C-bracket core       */
  --tube-red:  #ff8078;   /* conduit light channel      */
  --maroon:    #411b1e;
  --maroon-d:  #32171e;

  /* yellow */
  --bar-yel:   #fff252;
  --amber:     #7c401f;   /* hex icon                   */

  /* metals */
  --chrome:    #aebac6;
  --silver:    #a19596;
  --rim-top:   #626971;
  --rim-left:  #818d92;
  --rim-right: #74808a;
  --rim-bot:   #7b8997;

  /* darks */
  --slate:     #32303e;
  --field:     #1e202c;
  --cavity:    #221a25;
  --circuit:   #070e16;
  --edge:      #0d1218;

  --mono: Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Courier New", monospace;
  --sans: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

html, body { background: #05070a; }
body { display: grid; place-items: center; min-height: 100vh; }

#stage {
  position: relative; width: 1292px; height: 635px;
  background: var(--bg); overflow: hidden;
  font-family: var(--sans); font-kerning: none;
}

/* -- primitives ---------------------------------------------------------- */

/* Halo chamfer: cuts top-right + bottom-left at 45deg by --cut.
   Nesting a copy inset by S with --cut reduced by 0.5858*S gives a
   mathematically exact uniform-width outline — that is how the chips work. */
.oct {
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut),
                     100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
/* all four corners cut */
.oct4 {
  clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0,
                     100% var(--cut), 100% calc(100% - var(--cut)),
                     calc(100% - var(--cut)) 100%, var(--cut) 100%,
                     0 calc(100% - var(--cut)), 0 var(--cut));
}
/* bottom-right only */
.oct-br {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)),
                     calc(100% - var(--cut)) 100%, 0 100%);
}

.a { position: absolute; }

/* ==========================================================================
   C1 — STATUS CHIP
   plate box (--px,--py,--pw,--ph) carries the dark backing;
   outline centreline box (--ox,--oy,--ow,--oh) carries the 4px neon stroke.
   ========================================================================== */
.chip { position: absolute; left: var(--px); top: var(--py); width: var(--pw); height: var(--ph); }

/* The plate is NOT chrome: measured it is a near-black warm maroon slab.
   x700 column of the reference reads #16070b -> #1c0407 above the stroke and
   #120202 -> #110605 below it, never above luminance 30.                     */
.chip .plate {
  position: absolute; inset: 0; --cut: var(--pcut);
  background:
    linear-gradient(180deg,
      #1c1613 0px, #100708 1.2px, #150608 2.4px, #150506 3.4px,
      #0f0102 4.6px, #150204 5.7px, #1b0507 6.9px, #190306 8.6px,
      #1a0405 calc(100% - 5px), #1a0404 calc(100% - 3px),
      #170303 calc(100% - 1.4px), #100202 100%);
}
/* neutral warm-grey bloom under the plate's bottom edge.
   stops derived from the measured deltas over the backdrop:
   +32/17/13, +63/50/48, +67/62/60, +60/58/56, +28/28/26, +3/3/3           */
.chip .bloom {
  position: absolute; left: var(--blx); right: var(--blr);
  top: 100%; height: var(--blh); opacity: var(--blo, 1);
  background: linear-gradient(180deg,
     rgba(255,120,100,.055)  0%,
     rgba(255,150,120,.131)  8.3%,
     rgba(255,210,205,.257) 25%,
     rgba(255,240,235,.273) 41.7%,
     rgba(255,245,240,.245) 58.3%,
     rgba(255,255,250,.114) 75%,
     rgba(255,255,255,.012) 91.7%,
     rgba(255,255,255,0)   100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 15px, #000 calc(100% - 6px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 15px, #000 calc(100% - 6px), transparent 100%);
}
/* The neon outline is a stroked octagon. It has to be SVG: Chrome pixel-snaps
   the paint box of every CSS div, so a 4px stroke whose centreline sits at
   y=34.87 renders at 33..37 with no antialiasing at all. An SVG path is
   rasterised at sub-pixel precision, and feGaussianBlur reproduces the
   reference's ~0.8px soft shoulder that a hard CSS edge cannot.             */
svg.ringlayer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.ringlayer > path { fill: none; stroke-linejoin: miter; stroke: var(--stroke, #f85a5c); }
svg.ringlayer > path.halo { stroke-width: var(--hw, 3.8); stroke-opacity: .90; filter: url(#chipSoft); }
svg.ringlayer > path.core { stroke-width: var(--cw, 2.8); }
/* interior: fully opaque (no red must leak through) + the measured inward
   red glow that each stroke throws back into the cavity. Its outer edge sits
   1px outside the centreline so the stroke core hides it.                    */
.chip .inner {
  position: absolute;
  left: calc(var(--ox) - var(--px) - 1px);
  top:  calc(var(--oy) - var(--py) - 1px);
  width:  calc(var(--ow) + 2px);
  height: calc(var(--oh) + 2px);
  --cut: calc(var(--oc) + .586px);
  background:
    linear-gradient(180deg, rgba(255,30,30,var(--gt,.052)) 0, rgba(255,30,30,0) 18px),
    linear-gradient(0deg,   rgba(255,30,30,var(--gb,.070)) 0, rgba(255,30,30,0) 20px),
    linear-gradient(90deg,  rgba(255,30,30,var(--gs,.088)) 0, rgba(255,30,30,0) 25px),
    linear-gradient(270deg, rgba(255,30,30,var(--gs,.088)) 0, rgba(255,30,30,0) 25px),
    var(--fill, #060a10);
}
/* dark end-cap rail past the black gutter at the right end */
.chip .cap {
  position: absolute; left: var(--capx); width: var(--capw);
  top: var(--capy); height: var(--caph);
  border-radius: var(--capr, 3.5px);
  background: linear-gradient(90deg,
     var(--cap0,#0d0507) 0%, var(--cap1,#241a1c) 20%, var(--cap2,#382b2e) 32%,
     var(--cap3,#291e20) 45%, var(--cap4,#150e0e) 62%, var(--cap5,#130c0c) 100%);
}
.chip .label {
  position: absolute; left: 0; right: 0;
  font-family: var(--mono); font-weight: 700; color: #f2585a; white-space: nowrap; line-height: 1;
  text-shadow: 0 0 5px rgba(249,90,92,.45);
}

/* ==========================================================================
   C2 — SEGMENT BARS   (skewed round-rects, bottom leans right, 19.3deg)
   ========================================================================== */
.bars { position: absolute; top: var(--y); height: var(--h); }
/* The source art is out of focus, and anisotropically so: measured 10-90% edge
   widths are ~4px horizontally but 7.5-8px vertically. So the horizontal
   softness comes from a small uniform blur and the vertical softness is baked
   into the fill gradient via --ft / --fb (the top and bottom fade lengths).
   Box edges are placed at the measured 50% crossings +/- the fade. */
.bars .b {
  position: absolute; top: 0; height: 100%; width: 23.6px;
  border-radius: 13px;
  transform: skewX(18deg);
  filter: blur(1.4px);
}
.bars .b.r {
  background: linear-gradient(180deg,
    rgba(255,65,59,0)  0px,
    rgba(255,65,59,1)  var(--ft),
    #ff463d            55%,
    #ff3d35            calc(100% - var(--fb)),
    rgba(255,61,53,0)  100%);
}
.bars .b.y {
  background: linear-gradient(180deg,
    rgba(255,242,82,0) 0px,
    rgba(255,242,82,1) var(--ft),
    #fff453            55%,
    #f8e948            calc(100% - var(--fb)),
    rgba(248,233,72,0) 100%);
}
/* pale specular cap sitting on top of the solid region */
.bars .b::before {
  content: ""; position: absolute; left: 1.5px; right: 1.5px;
  top: calc(var(--ft) - 2px); height: 5px;
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
}
.bars .b.y::before { background: linear-gradient(180deg, rgba(237,217,112,.85), rgba(255,255,255,0)); }

/* ==========================================================================
   C5 — OCTAGON DISPLAY PLATE ("FAILED" screen)
   ========================================================================== */
.oplate { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); }
.oplate .body {
  position: absolute; inset: 0; --cut: 19px;
  background: linear-gradient(180deg, #1a1c22 0%, #0b0d12 8%, #070910 50%, #0b0d13 92%, #23262c 100%);
}
.oplate .glass {
  position: absolute; inset: 7px; --cut: 15px;
  background: var(--glass, #040910);
}
.oplate .glass::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(180deg, rgba(120,170,200,.035) 0 1px, transparent 1px 3px);
}
/* 1px cyan hairline inset ~9px from the outer edge */
.oplate .hair {
  position: absolute; --cut: 12px;
  left: var(--hx); top: var(--hy); width: var(--hw); height: var(--hh);
  background: rgba(90,160,190,.30);
}
.oplate .hair > i {
  position: absolute; inset: 1px; display: block; --cut: 11.4px;
  background: var(--glass, #040910);
}

/* ==========================================================================
   C4 — PANEL FRAME (914 x 125) — dark frame, recessed cavity, red C bracket
   ========================================================================== */
/* Coordinate system: .pframe origin = (344, 497) for C4a  -> every child offset
   below is (absolute reference px - that origin).  .pf-body starts 4.5px in,
   at x=348.5, which is the hard left edge of the metal; everything left of it
   (glow + the two lit chamfer facets) lives directly on .pframe.            */
.pframe { position: absolute; left: var(--x); top: var(--y);
          width: var(--w, 914.5px); height: 125px; }

/* ---- the metal body: outer silhouette + the whole vertical build-up ------ */
.pframe .pf-body {
  position: absolute; left: 4.5px; right: 0; top: 0; bottom: 0;
  clip-path: polygon(19.5px 0, 906.5px 0, 100% 3.5px, 100% 114px,
                     898.5px 100%, 27px 100%, 0 104px, 0 14px);
  background: linear-gradient(180deg,
      #1c1c1e 0px,   #1c1c1e 1px,    /* 497 soft outer bloom            */
      #444344 1px,   #444344 2px,    /* 498 specular rim peak           */
      #4c4a4c 2px,   #4c4a4c 3px,    /* 499                             */
      #201d1e 3px,   #201d1e 4px,    /* 500 flat dark-grey face         */
      #1f1c1e 4px,   #1f1c1e 5px,
      #201d1f 5px,   #201d1f 7px,
      #211e20 7px,   #211e20 8px,
      #221d1e 8px,   #221d1e 9px,    /* 505                             */
      #17100c 9px,   #17100c 10px,   /* 506 deep black inner gutter     */
      #110503 10px,  #110503 11px,
      #0b0100 11px,  #0b0100 12px,
      #050000 12px,  #050000 13px,
      #030000 13px,  #030000 15px,
      #080506 15px,  #080506 16px,   /* 512                             */
      #050101 16px,  #050101 108px,  /* 513..604 cavity gutter backing  */
      #120c11 108px, #120c11 109px,  /* 605 thin black gutter           */
      #080305 109px, #080305 110px,
      #161115 110px, #161115 111px,
      #2e2c31 111px, #2e2c31 112px,  /* 608 rail plate specular         */
      #39373d 112px, #39373d 113px,
      #3f3c40 113px, #3f3c40 114px,
      #3f3b3e 114px, #3f3b3e 115px,
      #2a2523 115px, #2a2523 116px,
      #17120e 116px, #17120e 117px,
      #171412 117px, #171412 118px,
      #191312 118px, #191312 119px,
      #171313 119px, #171313 120px,
      #191516 120px, #191516 121px,
      #292426 121px, #292426 122px,
      #605e62 122px, #605e62 123px,  /* 619 bottom bloom                */
      #8b8a8e 123px, #8b8a8e 124px,  /* 620                             */
      #48484d 124px, #48484d 125px); /* 621                             */
}
/* the three top rows and the three bottom rows carry almost all of the
   horizontal modulation, so each is its own 1px strip                       */
.pframe .pf-r { position: absolute; left: 0; right: 0; height: 1px; }
.pframe .pf-r0 { top: 0; background: linear-gradient(90deg,
  #413435 0px,#3a2f30 61px,#362d2e 101px,#342b2c 141px,#31282a 181px,#2e2628 221px,
  #2e2729 261px,#2c2527 310px,#1a1a1d 320px,#1c1d1f 381px,#1a1b1d 421px,#1d1d1f 461px,
  #1a1a1d 501px,#1e1e20 541px,#1e1e20 581px,#222021 621px,#242123 661px,#242124 701px,
  #201f22 741px,#17181b 781px,#111316 821px,#0d0f13 861px,#0b0d11 901px,#0a0c10 910px); }
.pframe .pf-r1 { top: 1px; background: linear-gradient(90deg,
  #5f5151 0px,#5c4f4f 61px,#5a4d4e 101px,#574b4c 141px,#544949 181px,#504645 221px,
  #504647 261px,#4c4344 310px,#444243 320px,#474546 381px,#444244 421px,#454344 461px,
  #424041 501px,#434040 541px,#433f3f 581px,#433e3e 621px,#433e3e 661px,#423e3f 701px,
  #393739 741px,#2e2e30 781px,#252728 821px,#242527 861px,#16171a 901px,#101215 910px); }
.pframe .pf-r2 { top: 2px; background: linear-gradient(90deg,
  #564a4b 0px,#544849 61px,#534849 101px,#524849 141px,#514749 181px,#4e4546 221px,
  #4e4547 261px,#4c4445 310px,#4c494a 320px,#4c494a 381px,#4a4749 421px,#4b4749 461px,
  #484546 501px,#474243 541px,#454142 581px,#454040 621px,#453f40 661px,#444041 701px,
  #3d3b3d 741px,#363537 781px,#302f31 821px,#323133 861px,#292a2e 901px,#232427 910px); }
.pframe .pf-r122 { top: 122px; background: linear-gradient(90deg,
  #442830 0px,#4c2a2e 61px,#513b40 101px,#594347 141px,#5a464a 181px,#5a474a 221px,
  #5d4a4e 261px,#5d4a4f 301px,#4b4144 314px,#605d62 318px,#605e61 381px,#626063 421px,
  #5c5a5d 461px,#575456 501px,#524f52 541px,#423f42 581px,#3e393d 621px,#2a2528 661px,
  #241e22 701px,#231e20 741px,#201c1d 781px,#1a1718 821px,#171314 861px,#141316 910px); }
.pframe .pf-r123 { top: 123px; background: linear-gradient(90deg,
  #55333a 0px,#61383e 61px,#7f595b 101px,#8d6769 141px,#8f6a6d 181px,#926d70 221px,
  #967073 261px,#977174 301px,#715b5f 314px,#8b898e 318px,#8c8a8f 381px,#8d8d92 421px,
  #86868a 461px,#7b797d 501px,#757378 541px,#615f64 581px,#565358 621px,#353236 661px,
  #2d282c 701px,#292428 741px,#261f22 781px,#181516 821px,#171313 861px,#111014 910px); }
.pframe .pf-r124 { top: 124px; background: linear-gradient(90deg,
  #391f25 0px,#3e2328 61px,#4d3437 101px,#54393c 141px,#53393d 181px,#543a3e 221px,
  #52383d 261px,#533a3e 301px,#4c3a3f 314px,#48474c 318px,#48474c 381px,#49484c 421px,
  #45454a 461px,#404045 501px,#3d3c41 541px,#36363a 581px,#313034 621px,#252326 661px,
  #222023 701px,#1f1c1f 741px,#231e21 781px,#181618 821px,#181517 861px,#0e0e12 910px); }
/* left plate / right plate overlays for rail rows 605..618 (seams x=663.5, 1155.5) */
.pframe .pf-railL { position: absolute; left: 0; width: 315px; top: 108px; height: 14px;
  background: linear-gradient(180deg,
     #0f0a0e 0px,#0f0a0e 1px,#070205 1px,#070205 2px,#161214 2px,#161214 3px,
     #29272a 3px,#29272a 4px,#2e2d32 4px,#2e2d32 5px,#302f33 5px,#302f33 6px,
     #302f31 6px,#302f31 7px,#22201f 7px,#22201f 8px,#171211 8px,#171211 9px,
     #171312 9px,#171312 10px,#191415 10px,#191415 11px,#181414 11px,#181414 12px,
     #181415 12px,#181415 13px,#231c21 13px,#231c21 14px); }
.pframe .pf-railR { position: absolute; left: 807px; right: 0; top: 108px; height: 14px;
  background: linear-gradient(180deg,
     #0e090e 0px,#0e090e 1px,#040203 1px,#040203 2px,#0f0b0f 2px,#0f0b0f 3px,
     #1a181c 3px,#1a181c 4px,#1a191e 4px,#1a191e 5px,#1e1d21 5px,#1e1d21 6px,
     #201f22 6px,#201f22 7px,#212121 7px,#212121 8px,#171514 8px,#171514 9px,
     #1a1818 9px,#1a1818 13px,#1a1819 13px,#1a1819 14px); }

/* ---- recessed cavity ---------------------------------------------------- */
.pframe .pf-cav {
  position: absolute; left: 31.5px; right: 18px; top: 15.5px; height: 92px;
  clip-path: polygon(0 0, 855px 0, 100% 5px, 100% 100%, 18px 100%, 0 77px);
  background:
    radial-gradient(340px 52px at 27% 66%, rgba(195,215,220,.055), rgba(195,215,220,0) 72%),
    linear-gradient(180deg,
      #17151b 0px, #17161b 4px, #17151a 10px, #19171c 16px, #1a171c 22px,
      #191619 28px, #191519 34px, #191419 40px, #191419 46px, #1b1618 52px,
      #1b1618 58px, #1b1517 64px, #1b1517 70px, #1b1419 76px, #1a1517 82px,
      #181315 88px, #171214 92px);
}
/* right half of the cavity: colder, darker, with the warm reflection blob    */
.pframe .pf-cavr {
  position: absolute; left: 283.5px; right: 0; top: 0; bottom: 0;
  background:
    linear-gradient(90deg, rgba(8,6,12,.34) 0px, rgba(8,6,12,.12) 6px, rgba(8,6,12,0) 15px,
                    rgba(8,6,12,0) 78%, rgba(46,52,74,.16) 92%, rgba(12,10,18,.40) 100%),
    radial-gradient(150px 62px at 28% 54%, rgba(160,145,80,.19), rgba(160,145,80,0) 72%),
    radial-gradient(125px 50px at 12% 26%, rgba(150,155,195,.13), rgba(150,155,195,0) 74%),
    linear-gradient(180deg,
      #1c1b25 0px, #1d1c26 4px, #1b1a23 10px, #1a181f 16px, #1a171d 22px,
      #19141b 28px, #191219 34px, #191117 40px, #1a1017 46px, #1a1016 52px,
      #1a1016 58px, #191015 64px, #191016 70px, #181117 76px, #171117 82px,
      #150e15 88px, #130c13 92px);
}
/* bluish top reflection band, strongest at the right-hand end               */
.pframe .pf-cavr::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
  background:
    linear-gradient(180deg, rgba(58,80,150,.26), rgba(58,80,150,0)),
    linear-gradient(90deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,0) 240px);
}

/* ---- right-hand edge ---------------------------------------------------- */
.pframe .pf-rmar {              /* 2px maroon stripe, x 1244..1246.5 */
  position: absolute; right: 12px; width: 2.5px; top: 19.5px; height: 87px;
  background: linear-gradient(90deg, #1a0a0f 0 .6px, #2d161c .6px 1.9px, #261519 1.9px 2.5px);
}
.pframe .pf-rface {             /* grey face + 3px chrome edge, x 1246.5..1258.5 */
  position: absolute; right: 0; width: 12px; top: 3.5px; bottom: 0;
  background: linear-gradient(90deg, #1c191a 0 7.5px, #16181d 7.5px 8.5px,
              #2d373f 8.5px 9.5px, #7f8993 9.5px 10.5px, #817f80 10.5px 11.5px,
              #2d2a26 11.5px 12px);
}
.pframe .pf-riv {               /* 9x9 rivet centred (1249.5, 505) */
  position: absolute; left: 896.5px; top: 3.5px; width: 9px; height: 9px;
  background: radial-gradient(circle at 4.5px 4.5px,
      #3d3d42 0 1.7px, #2b2b2f 2.3px, #15141a 2.9px, #0c0a0b 3.7px, #12100f 4.5px,
      rgba(0,0,0,0) 4.6px);
}

/* ---- left end: chamfer facets, bevel, warm face, red glow ---------------- */
.pframe .pf-lside {             /* red bloom that leaks past the metal edge  */
  position: absolute; left: 0; width: 4.5px; top: 12px; height: 92px;
  background: linear-gradient(90deg,
      rgba(245,90,92,.010) 0px, rgba(245,90,92,.040) 1px, rgba(245,90,92,.075) 2px,
      rgba(245,90,92,.120) 3px, rgba(245,90,92,.160) 4px, rgba(245,90,92,.175) 4.5px);
}
.pframe .pf-fct, .pframe .pf-fcb {   /* the two lit chamfer facets */
  position: absolute; left: 0; width: 4.5px;
  background:
    linear-gradient(180deg, #0a0c10 0px, rgba(10,12,16,0) 2.5px,
                    rgba(10,12,16,0) var(--f1), #0a0c10 var(--f2)),
    linear-gradient(90deg, #271b1e 0 1px, #5a383b 1px 2px, #674446 2px 3px,
                    #624447 3px 4px, #5b4044 4px 4.5px);
}
.pframe .pf-fct { top: 12px;  height: 24px; --f1: 18px; --f2: 24px; }
.pframe .pf-fcb { top: 89px;  height: 17px; --f1: 12px; --f2: 17px;
  background:
    linear-gradient(180deg, #0a0c10 0px, rgba(10,12,16,0) 2.5px,

/* C7 — micro technical text -------------------------------------------------
   10 lines, pitch 4.55px, glyph band 3px.  Gutter block x30..31, text from
   x=37.  Per-line widths are tuned so the right edges land on the measured
   55/31/88/57/75/132/93/57/53/70.                                          */
.microtext {
  position: absolute; left: 30px; top: 321.35px; width: 140px;
  font-family: var(--mono); font-size: 3.9px; line-height: 4.55px;
  color: rgba(150,185,205,.66); white-space: nowrap; letter-spacing: -.05px;
}
.microtext > div { position: relative; padding-left: 7px; }
.microtext > div::before {
  content: ""; position: absolute; left: 0; top: -.65px;
  width: 2.4px; height: 2.15px; background: rgba(182,208,222,.40);
}

.hexicon { position: absolute; left: 397px; top: 297px; width: 30px; height: 31px; }

   and a 12px period pitch against the reference's 24/22/7/20 and 12. Sized so
   cap height = 30px (y296..326) and tracked -0.35px to kill a 2% overrun. */

  font-size: 41.9px; line-height: 1;

}
