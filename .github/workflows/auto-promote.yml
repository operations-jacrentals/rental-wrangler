name: Auto-promote — take a merged Wrangler auto-fix live

# ── Mr. Wrangler's go-live step ───────────────────────────────────────────────
# When an auto-fix PR (opened by the wrangler-fix engine and carrying the
# `auto-promote` label) squash-merges to `trunk`, this promotes that exact commit
# to `production` so the fix reaches app.jacrentals.com in real time — with NO
# human in the loop. It runs the same tools/promote.mjs a human runs for Gate 2.
#
# WHY THIS EXISTS
# Under the trunk model, Pages serves `production`, so merging to `trunk` is NOT
# live on its own. The wrangler-fix engine merges the fix to trunk but stops
# there — this closes the last mile so an end-user's reported fix actually goes
# live without them (or Jac) touching the deploy machinery.
#
# ONLY auto-fixes TRIGGER an auto-promote. A human's merge to `trunk` carries no
# `auto-promote` label, so it never triggers this job on its own — it still waits
# for the human `/promote` (Gate 2). One caveat, made explicit: promote.mjs
# fast-forwards `production` to the FULL `trunk` tip, so when an auto-fix does
# promote, any CI-green human work already merged to trunk but not yet `/promote`d
# rides live with it. That's safe (everything on trunk passed CI), and the final
# step below leaves a heads-up comment on the PR listing anything that rode along,
# so an auto-fix never takes other work live silently.
#
# HOW IT STAYS SAFE (fully machine-gated — no human review, but every gate must pass):
#   1. `smoke` + `logic-test` CI already gated the merge to trunk (a broken fix
#      never reaches trunk, so it never reaches here).
#   2. The fix's own branch already deployed to staging (in wrangler-fix.yml), so
#      promote.mjs's staging-freshness gate passes AND staging stays in sync with
#      production (no drift for the next human promote).
#   2b. A range that touches rail.json (the rw-api routing switch, S3-5 A) is
#      refused, so a routing flip never rides an auto-fix live. The refusal that
#      counts is the INLINE step below ("Refuse an unattended range that touches
#      rail.json"): shell and git only, no repo script. The range being judged
#      could rewrite any repo script (the wrangler-fix PAT has Contents: write),
#      but not this file (that PAT has no Workflows permission). promote.mjs
#      --unattended repeats the same check as a second layer, and the step after
#      the promote fails the job loudly if production did not land on exactly the
#      trunk tip the inline step checked.
#   3. promote.mjs is fast-forward-only (never --force) and verifies the live
#      `?v=` bytes after pushing. If anything is off it fails — it never forces a
#      half-broken state onto the live site.
#   If any gate is red, this job fails and the fix stays at trunk (not live);
#   surface it to Jac rather than forcing it live.
#
# ── OFF BY DEFAULT — this is Jac's one-time switch ────────────────────────────
# The job no-ops until the repository VARIABLE `WRANGLER_AUTO_PROMOTE` is set to
# the string 'true' (Settings → Secrets and variables → Actions → Variables tab).
# Until then a merged auto-fix stops at trunk exactly like today — NOTHING reaches
# the live customer app before Jac flips that variable. Flip it back to anything
# else (or delete it) to instantly disable auto-go-live again.
#
# Also required (already needed by wrangler-fix.yml, no new secret):
#   secrets.WRANGLER_PAT — fine-grained PAT, Contents: Read & write on this repo,
#   so promote.mjs can fast-forward `production`.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write

jobs:
  promote:
    # Gate: a merged auto-fix PR into trunk, and the switch is ON.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'trunk' &&
      contains(github.event.pull_request.labels.*.name, 'auto-promote') &&
      vars.WRANGLER_AUTO_PROMOTE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so promote.mjs can fetch trunk + production and compute
          # the fast-forward. The PAT (Contents: write) authenticates the push to
          # `production` that promote.mjs performs via `origin`.
          fetch-depth: 0
          token: ${{ secrets.WRANGLER_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record the production tip before promoting
        # Baseline for the heads-up step below: where production sat BEFORE the
        # fast-forward. Captured to $GITHUB_ENV now (before promote.mjs moves the
        # ref) so we can diff old→new production afterward and report anything that
        # rode live besides this auto-fix. FETCH_HEAD is reliable right after fetch.
        run: |
          git fetch origin production
          echo "PROD_BEFORE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Refuse an unattended range that touches rail.json (S3-5 A)
        # S3-5 A, RC-92, first layer. rail.json turns rw-api routing on or off for every
        # device, so it only ever goes live through a human promote. This check lives
        # HERE, inline, because everything else this job runs comes from the merged
        # PR's own checkout: an auto-fix could rewrite promote.mjs / promote-guard.mjs
        # and the tests that pin them in the same PR that turns routing on. The
        # wrangler-fix PAT cannot edit a workflow file, so it cannot edit this step.
        # Same rule as tools/lib/promote-guard.mjs: every path any commit in
        # production..trunk touched (merges diffed against each parent, renames as
        # delete + add) plus the net diff; a last path segment of rail.json in any
        # case counts. Any git failure fails the step (fails closed). Shell + git only:
        # never call a repo script from this step. ci/promote-test.mjs runs this block.
        id: rail-refusal
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin '+refs/heads/trunk:refs/remotes/origin/trunk' '+refs/heads/production:refs/remotes/origin/production'
          PROD=$(git rev-parse --verify 'refs/remotes/origin/production^{commit}')
          TRUNK=$(git rev-parse --verify 'refs/remotes/origin/trunk^{commit}')
          HITS=$( { git diff -z --name-only --no-renames "$PROD" "$TRUNK"; git log -z --format= --name-only --no-renames -m "$PROD..$TRUNK"; } | tr '\0' '\n' | awk -F/ 'tolower($NF) == "rail.json"' | sort -u | tr '\n' ' ' )
          if [ -n "$HITS" ]; then
            echo "::error::auto-promote: refusing an unattended promote, this range touches $HITS(the rw-api routing switch, S3-5 A). Routing goes live only through a human promote. Nothing was pushed."
            exit 1
          fi
          echo "RAIL_CHECKED_PROD=$PROD" >> "$GITHUB_ENV"
          echo "RAIL_CHECKED_TRUNK=$TRUNK" >> "$GITHUB_ENV"
          echo "auto-promote: rail.json is untouched in $PROD..$TRUNK (S3-5 A)."

      - name: Promote the merged auto-fix to production (go live)
        # promote.mjs: fetch trunk+production, verify staging is fresh, fast-forward
        # production -> trunk, then verify the live ?v= bytes. --yes runs it for real.
        # --unattended (S3-5 A, RC-92) is the SECOND layer of the rail.json refusal:
        # promote.mjs comes from the merged checkout, so the inline step above is the
        # one that holds even if an auto-fix rewrote promote.mjs.
        run: node tools/promote.mjs --yes --unattended

      - name: Confirm production landed on the trunk tip that was checked (S3-5 A)
        # promote.mjs fetches trunk again, so trunk could move between the inline
        # check above and the push. Whatever the promote step did, production must now
        # sit either where it started (nothing pushed) or on exactly the trunk tip the
        # inline step checked. Anything else fails the job loudly: a commit nobody
        # checked for rail.json may be live. Shell + git only, like the refusal step.
        if: always() && steps.rail-refusal.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin '+refs/heads/production:refs/remotes/origin/production'
          NOW=$(git rev-parse --verify 'refs/remotes/origin/production^{commit}')
          if [ "$NOW" != "$RAIL_CHECKED_TRUNK" ] && [ "$NOW" != "$RAIL_CHECKED_PROD" ]; then
            echo "::error::auto-promote: production is at $NOW, which is neither the trunk tip checked for rail.json ($RAIL_CHECKED_TRUNK) nor where it started ($RAIL_CHECKED_PROD). Commits nobody checked may be live: read rail.json on production now, and if it changed put it back by a human promote (S3-5 A)."
            exit 1
          fi
          echo "auto-promote: production is at $NOW (checked for rail.json, S3-5 A)."

      - name: Tell the reporter it's live
        if: success()
        env:
          GH_TOKEN: ${{ secrets.WRANGLER_PAT }}
        run: |
          # The merged PR body carries "Closes #<n>" pointing at the original report.
          ISSUE=$(printf '%s' "${{ github.event.pull_request.body }}" | grep -oiE 'closes #[0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "✅ Shipped and **live** now — refresh the page to see it. — Mr. Wrangler"
          else
            echo "auto-promote: promoted, but found no 'Closes #<n>' in the PR body to comment on."
          fi

      - name: Heads-up if other trunk commits rode live with this auto-fix
        # promote.mjs fast-forwards production to the whole trunk tip, so this
        # auto-fix can carry CI-green work that was merged to trunk but deliberately
        # left for a manual /promote. Safe (all of trunk passed CI) but it means
        # "/promote is my gate" isn't strict — so leave a developer-facing audit
        # trail on the PR when it happens. Never blocks: the fix already went live.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.WRANGLER_PAT }}
          PROD_BEFORE: ${{ env.PROD_BEFORE }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin production
          PROD_AFTER=$(git rev-parse FETCH_HEAD)
          # Fallback so an (unexpected) empty merge sha can't over-report every commit.
          [ -z "$MERGE_SHA" ] && MERGE_SHA="$PROD_AFTER"
          # Everything this promote took live, minus the auto-fix's own squash commit.
          RODE=$(git log --no-merges --format='%H %h %s' "$PROD_BEFORE..$PROD_AFTER" \
                   | grep -vi "^$MERGE_SHA " || true)
          if [ -n "$RODE" ]; then
            COUNT=$(printf '%s\n' "$RODE" | grep -c '')
            {
              echo "⚠️ **Heads-up — this auto-promote also took $COUNT other trunk commit(s) live.**"
              echo
              echo "\`promote.mjs\` fast-forwards \`production\` to the whole \`trunk\` tip, so work merged to trunk but not yet \`/promote\`d rode live with this auto-fix:"
              echo
              printf '%s\n' "$RODE" | sed -E 's/^[^ ]+ ([^ ]+) /- `\1` /'
              echo
              echo "All were CI-green on trunk, so nothing unverified shipped — but if you meant to hold any for a batched \`/promote\`, that's why they're live now."
            } > "$RUNNER_TEMP/rode.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/rode.md"
          else
            echo "auto-promote: no other commits rode along — clean single-fix promote."
          fi
